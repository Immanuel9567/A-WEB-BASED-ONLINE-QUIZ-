<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student dashboard — ClassMark</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231a73e8'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="app">
<div id="nav"></div>

<main class="container">
  <section class="pagehead">
    <div>
      <h1>Student dashboard</h1>
      <p class="sub" id="welcome">Loading…</p>
    </div>
  </section>

  <section class="statgrid" id="stats"></section>

  <h2 class="sec">Classes</h2>
  <section class="card tight" id="classesCard"><p class="small muted skeleton">Loading…</p></section>

  <h2 class="sec">Available quizzes</h2>
  <section class="quizgrid" id="quizzes">
    <div class="card skeleton">Loading quizzes…</div>
  </section>

  <h2 class="sec" id="results">My results</h2>
  <section class="card tablecard">
    <table>
      <thead><tr><th>Quiz</th><th>Score</th><th>Percent</th><th>Outcome</th><th>Time used</th><th>Submitted</th><th></th></tr></thead>
      <tbody id="resultsBody"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
    </table>
  </section>

  <p style="margin:26px 2px 50px"></p>
</main>

<script src="js/app.js"></script>
<script>
(async function () {
  var user = await requireLogin('student');
  navbar(user, 'dashboard');
  document.getElementById('welcome').textContent =
    'Welcome back, ' + user.name.split(' ')[0] + ' — results appear here the moment you submit.';

  async function loadAll() {
  var data = await Promise.all([
    GET('/api/quizzes'),
    GET('/api/me/attempts')
  ]);
  var quizzes = data[0].quizzes;
  var mine = data[1].attempts.filter(function (a) { return a.status !== 'in_progress'; });

  /* ---- stats ------------------------------------------------------------ */
  var available = quizzes.filter(function (q) {
    return winState(q) === 'open' && (q.inProgressAttemptId || (q.attemptsUsed < q.attemptsAllowed && q.questionCount > 0));
  });
  var avg = mine.length ? Math.round(mine.reduce(function (s, a) { return s + a.percent; }, 0) / mine.length * 10) / 10 : null;
  var best = mine.length ? Math.max.apply(null, mine.map(function (a) { return a.percent; })) : null;
  document.getElementById('stats').innerHTML =
    stat(available.length, 'Quizzes open to me') +
    stat(mine.length, 'Attempts submitted') +
    stat(fmtPct(avg), 'My average score', true) +
    stat(fmtPct(best), 'My best score');

  function stat(num, lbl, accent) {
    return '<div class="stat' + (accent ? ' accent' : '') + '"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
  }

  /* ---- classes (join with a teacher's code) ------------------------------- */
  var clEl = document.getElementById('classesCard');
  async function loadClasses() {
    try {
      var d = await GET('/api/classes');
      var chips = d.classes.map(function (c) {
        return '<a class="chip" href="class.html?id=' + c.id + '">' + icon('bookOpen', 13) + ' ' + esc(c.name) + ' — ' + esc(c.teacherName) + '</a>';
      }).join('');
      clEl.innerHTML =
        '<div class="row" style="flex-wrap:wrap;align-items:flex-start">' +
        '<div style="flex:1;min-width:240px">' +
        (chips ? '<div class="classchips">' + chips + '</div>' : '<p class="small muted" style="margin:0">You have not joined a class yet — enter your teacher\'s code to see their class quizzes.</p>') +
        '</div>' +
        '<div class="row"><input id="joinCode" type="text" placeholder="Class code" style="width:150px;text-transform:uppercase" autocomplete="off">' +
        '<button class="btn primary" id="joinBtn"></button></div>' +
        '</div>';
      document.getElementById('joinBtn').innerHTML = icon('plus', 15) + ' Join class';
      document.getElementById('joinBtn').onclick = async function () {
        this.disabled = true;
        try {
          var r = await POST('/api/classes/join', { code: document.getElementById('joinCode').value });
          toast('Joined ' + r.class.name + ' — its quizzes now appear on your dashboard');
          loadAll();
        } catch (err) { toast(err.message, 'bad'); this.disabled = false; }
      };
    } catch (err) {
      clEl.innerHTML = '<p class="small muted">Could not load classes.</p>';
    }
  }
  loadClasses();

  /* ---- quiz cards -------------------------------------------------------- */
  var qEl = document.getElementById('quizzes');
  if (!quizzes.length) {
    qEl.innerHTML = '<div class="card"><div class="empty"><div class="eico">' + icon('inbox', 34) + '</div>' +
      'No quizzes yet — join your teacher\'s class with a class code and their quizzes will appear here.</div></div>';
  } else {
    qEl.innerHTML = quizzes.map(card).join('');
    $$('#quizzes [data-start]').forEach(function (btn) {
      btn.onclick = async function () {
        btn.disabled = true; btn.textContent = 'Starting…';
        try {
          var r = await POST('/api/attempts', { quizId: btn.getAttribute('data-start') });
          location.href = 'quiz.html?attempt=' + r.attempt.id;
        } catch (err) { toast(err.message, 'bad'); btn.disabled = false; btn.textContent = 'Start quiz'; }
      };
    });
  }

  function card(q) {
    var cls = (q.classInfo && q.classInfo.length) ? q.classInfo : null;
    var cc = cls && cls[0] && cls[0].color ? cls[0].color : '';
    var actions = '';
    var win = winState(q);
    if (q.inProgressAttemptId) {
      actions = '<a class="btn primary block" href="quiz.html?attempt=' + q.inProgressAttemptId + '">' + icon('chevronRight', 15) + ' Resume attempt</a>';
    } else if (win === 'upcoming') {
      actions = '<span class="badge plain">Not open yet — opens ' + fmtWhen(q.opensAt) + '</span>';
    } else if (win === 'closed') {
      actions = '<span class="badge warn">Closed ' + fmtWhen(q.closesAt) + '</span>';
    } else if (q.attemptsUsed >= q.attemptsAllowed) {
      actions = '<span class="badge plain">No attempts left</span>';
    } else if (!q.questionCount) {
      actions = '<span class="badge plain">No questions yet</span>';
    } else {
      actions = '<button class="btn primary block" data-start="' + q.id + '">' + (q.attemptsUsed ? 'Retake quiz' : 'Start quiz') + '</button>' +
        (q.closesAt ? '' : '');
    }
    var outcome = '';
    if (q.bestPercent != null) {
      outcome = '<span class="badge ' + (q.bestPassed ? 'ok' : 'bad') + '">' +
        (q.bestPassed ? 'Passed' : 'Failed') + ' &middot; best ' + fmtPct(q.bestPercent) + '</span>';
    }
    return '' +
      '<div class="card hover classcard"' + (cc ? ' style="--cc:' + esc(cc) + '"' : '') + '>' +
      '<div class="row" style="margin-bottom:9px"><span class="chip">' + icon('fileText', 13) + ' ' + esc(q.subject) + '</span>' +
      (cls ? cls.map(function (c) {
        return '<span class="chip classchip">' + (c.color ? '<span class="classdot" style="background:' + esc(c.color) + '"></span>' : '') + esc(c.name) + '</span>';
      }).join('') : '') +
      '<span class="spacer"></span>' + outcome + '</div>' +
      '<h3 style="font-size:18.5px">' + esc(q.title) + '</h3>' +
      '<p class="muted small" style="min-height:38px">' + esc(q.description || '') + '</p>' +
      '<div class="row small muted" style="margin-bottom:12px">' +
      '<span>' + icon('timer', 14) + ' ' + q.durationMin + ' min</span>' +
      '<span>' + icon('helpCircle', 14) + ' ' + q.questionCount + ' questions</span>' +
      '<span>' + icon('flag', 14) + ' pass ' + q.passMark + '%</span>' +
      (q.closesAt && win === 'open' ? '<span>' + icon('timer', 14) + ' closes ' + fmtWhen(q.closesAt) + '</span>' : '') +
      '</div>' +
      '<div class="row small muted" style="margin-bottom:16px">Attempts used: <b>&nbsp;' + q.attemptsUsed + '/' + q.attemptsAllowed + '</b></div>' +
      actions +
      '</div>';
  }

  /* ---- results table ----------------------------------------------------- */
  var rEl = document.getElementById('resultsBody');
  if (!mine.length) {
    rEl.innerHTML = '<tr><td colspan="7"><div class="empty"><div class="eico">' + icon('fileText', 34) + '</div>' +
      'No results yet — take your first quiz above.</div></td></tr>';
  } else {
    rEl.innerHTML = mine.map(function (a) {
      return '<tr>' +
        '<td><b>' + esc(a.quizTitle) + '</b></td>' +
        '<td><b>' + a.score + '/' + a.maxScore + '</b></td>' +
        '<td><b>' + fmtPct(a.percent) + '</b></td>' +
        '<td><span class="badge ' + (a.passed ? 'ok' : 'bad') + '">' + (a.passed ? 'Pass' : 'Fail') + '</span></td>' +
        '<td>' + fmtDur(a.durationUsedSec) + '</td>' +
        '<td class="small muted">' + fmtWhen(a.submittedAt) + '</td>' +
        '<td><a class="btn sm" href="result.html?attempt=' + a.id + '">View</a></td>' +
        '</tr>';
    }).join('');
  }

  }
  try { loadAll(); }
  catch (e) {
    document.getElementById('quizzes').innerHTML =
      '<div class="card"><p class="muted" style="margin:0">Could not load your quizzes — ' + esc(e.message) + '</p></div>';
  }
})().catch(function () {});
</script>
</body>
</html>
