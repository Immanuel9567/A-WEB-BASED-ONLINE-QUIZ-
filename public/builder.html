<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question bank — OQAS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f46e5'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="nav"></div>

<main class="container">
  <section class="pagehead">
    <div>
      <h1 id="qzTitle">Question bank</h1>
      <p class="sub" id="qzMeta">Loading…</p>
    </div>
    <div class="row">
      <a class="btn" href="teacher.html">← Quizzes</a>
      <a class="btn primary" id="insightsLink" href="#">📈 Insights</a>
      <button class="btn" id="pubBtn"></button>
    </div>
  </section>

  <div class="twocol">
    <!-- ============ question list ============ -->
    <section>
      <div class="card" style="position:sticky;top:80px">
        <div class="row" style="margin-bottom:12px">
          <b style="font-size:15px">Questions</b>
          <span class="spacer"></span>
          <span class="chip" id="qCount">0</span>
        </div>
        <div id="qlist"><p class="muted small skeleton">Loading…</p></div>
      </div>
    </section>

    <!-- ============ editor form ============ -->
    <section class="card">
      <h3 id="formTitle" style="font-size:17px">➕ Add a new question</h3>
      <div class="form-err" id="formErr" hidden></div>

      <div class="field">
        <label for="fType">Question type</label>
        <select id="fType">
          <option value="single">Single choice (radio)</option>
          <option value="multiple">Multiple response (checkboxes)</option>
          <option value="truefalse">True / False</option>
        </select>
      </div>

      <div class="field">
        <label for="fText">Question text</label>
        <textarea id="fText" placeholder="Type the question…"></textarea>
      </div>

      <div id="optsWrap">
        <label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:7px;color:#374151">
          Options — click the ✓ circle to mark the correct one(s)
        </label>
        <div id="optRows"></div>
        <button class="btn sm" id="addOptBtn" type="button">＋ Add option</button>
      </div>

      <div id="tfWrap" hidden>
        <label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:7px;color:#374151">Correct answer</label>
        <div class="segment" style="max-width:220px">
          <button type="button" id="tfTrue" class="on">True</button>
          <button type="button" id="tfFalse">False</button>
        </div>
      </div>

      <div class="formrow">
        <div class="field">
          <label for="fPoints">Points</label>
          <input id="fPoints" type="number" min="1" max="10" value="1">
        </div>
        <div class="field">
          <label for="fExpl">Explanation (shown after grading)</label>
          <input id="fExpl" type="text" placeholder="Optional…">
        </div>
      </div>

      <div class="row">
        <span class="spacer"></span>
        <button class="btn" id="resetBtn" type="button" hidden>Cancel edit</button>
        <button class="btn primary" id="saveBtn" type="button">Save question</button>
      </div>
    </section>
  </div>
  <p style="margin:26px 2px 50px"></p>
</main>

<script src="js/app.js"></script>
<script>
(async function () {
  var user = await requireLogin('teacher');
  navbar(user, 'dashboard');

  var quizId = new URLSearchParams(location.search).get('id');
  if (!quizId) { location.href = 'teacher.html'; return; }

  var data;
  try { data = await GET('/api/quizzes/' + quizId + '/questions'); }
  catch (err) { toast(err.message, 'bad'); setTimeout(function () { location.href = 'teacher.html'; }, 1200); return; }
  var quiz = data.quiz;
  var questions = data.questions;

  document.getElementById('qzTitle').textContent = quiz.title;
  document.getElementById('qzMeta').textContent =
    quiz.subject + ' · ' + quiz.durationMin + ' min · pass ' + quiz.passMark + '% · ' +
    (quiz.published ? 'published' : 'draft');
  document.getElementById('insightsLink').href = 'insights.html?id=' + quizId;

  var pubBtn = document.getElementById('pubBtn');
  function paintPub() {
    pubBtn.textContent = quiz.published ? '🌐 Unpublish' : '🚀 Publish';
  }
  pubBtn.onclick = async function () {
    pubBtn.disabled = true;
    try {
      var r = await PUT('/api/quizzes/' + quizId, { published: !quiz.published });
      quiz.published = r.quiz.published;
      paintPub();
      toast(quiz.published ? 'Published — visible to students' : 'Unpublished — hidden from students');
    } catch (err) { toast(err.message, 'bad'); }
    pubBtn.disabled = false;
  };
  paintPub();

  /* ================= list ================= */
  var TYPE_LABEL = { single: 'Single choice', multiple: 'Multiple response', truefalse: 'True / False' };
  function renderList() {
    document.getElementById('qCount').textContent = questions.length + ' question' + (questions.length === 1 ? '' : 's');
    var el = document.getElementById('qlist');
    if (!questions.length) {
      el.innerHTML = '<p class="muted small" style="padding:14px 4px">No questions yet. Use the form to add the first one. ➡️</p>';
      return;
    }
    el.innerHTML = questions.map(function (q, i) {
      var opts = (q.options || []).map(function (o, oi) {
        var correct = q.type === 'multiple' ? q.answer.indexOf(oi) >= 0 : q.answer === oi;
        return '<div class="oo' + (correct ? ' correct' : '') + '">' + LETTER(oi) + '. ' + esc(o) + '</div>';
      }).join('');
      return '<div class="qmini">' +
        '<div class="row" style="margin-bottom:7px">' +
        '<span class="chip">' + (i + 1) + '</span><span class="chip info">' + TYPE_LABEL[q.type] + '</span>' +
        '<span class="chip">' + q.points + ' pt' + (q.points > 1 ? 's' : '') + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn sm" data-edit="' + q.id + '">Edit</button>' +
        '<button class="btn sm danger" data-rm="' + q.id + '">✕</button>' +
        '</div><div class="qq">' + esc(q.text) + '</div>' + opts + '</div>';
    }).join('');

    $$('[data-edit]', el).forEach(function (b) {
      b.onclick = function () { startEdit(questions.find(function (q) { return q.id === b.getAttribute('data-edit'); })); };
    });
    $$('[data-rm]', el).forEach(function (b) {
      b.onclick = async function () {
        var q = questions.find(function (x) { return x.id === b.getAttribute('data-rm'); });
        var ok = await confirmModal({
          title: 'Delete this question?',
          body: '“' + esc(q.text.slice(0, 90)) + '”',
          okText: 'Delete', danger: true
        });
        if (!ok) return;
        try {
          await DEL('/api/questions/' + q.id);
          questions = questions.filter(function (x) { return x.id !== q.id; });
          renderList();
          toast('Question deleted');
        } catch (err) { toast(err.message, 'bad'); }
      };
    });
  }

  /* ================= editor ================= */
  var editingId = null;
  var fType = document.getElementById('fType');
  var fText = document.getElementById('fText');
  var fPoints = document.getElementById('fPoints');
  var fExpl = document.getElementById('fExpl');
  var optRows = document.getElementById('optRows');
  var tfAnswer = 0;

  document.getElementById('tfTrue').onclick = function () {
    tfAnswer = 0; this.classList.add('on'); document.getElementById('tfFalse').classList.remove('on');
  };
  document.getElementById('tfFalse').onclick = function () {
    tfAnswer = 1; this.classList.add('on'); document.getElementById('tfTrue').classList.remove('on');
  };

  fType.onchange = function () { syncTypeUI(); };

  function syncTypeUI() {
    var tf = fType.value === 'truefalse';
    document.getElementById('optsWrap').hidden = tf;
    document.getElementById('tfWrap').hidden = !tf;
  }

  function optRowHtml(text, correct) {
    return '<div class="optrow">' +
      '<button type="button" class="markbtn' + (correct ? ' on' : '') + '" title="Mark correct">✓</button>' +
      '<input type="text" class="optinput" placeholder="Option text" value="' + esc(text || '') + '">' +
      '<button type="button" class="btn sm ghost rmopt" title="Remove">✕</button>' +
      '</div>';
  }

  function addOptRow(text, correct) {
    if ($$('.optrow').length >= 6) { toast('Maximum 6 options', 'bad'); return; }
    optRows.insertAdjacentHTML('beforeend', optRowHtml(text, correct));
    var row = optRows.lastElementChild;
    row.querySelector('.markbtn').onclick = function () {
      if (fType.value === 'single') $$('.markbtn').forEach(function (b) { b.classList.remove('on'); });
      this.classList.toggle('on');
    };
    row.querySelector('.rmopt').onclick = function () {
      if ($$('.optrow').length <= 2) { toast('Minimum 2 options', 'bad'); return; }
      row.remove();
    };
  }
  document.getElementById('addOptBtn').onclick = function () { addOptRow('', false); };

  function resetForm() {
    editingId = null;
    document.getElementById('formTitle').textContent = '➕ Add a new question';
    document.getElementById('resetBtn').hidden = true;
    fType.value = 'single'; fText.value = ''; fPoints.value = 1; fExpl.value = '';
    optRows.innerHTML = '';
    addOptRow('', false); addOptRow('', false); addOptRow('', false); addOptRow('', false);
    document.getElementById('tfTrue').click();
    document.getElementById('formErr').hidden = true;
    syncTypeUI();
  }

  function startEdit(q) {
    editingId = q.id;
    document.getElementById('formTitle').textContent = '✏️ Editing question';
    document.getElementById('resetBtn').hidden = false;
    fType.value = q.type;
    fText.value = q.text;
    fPoints.value = q.points;
    fExpl.value = q.explanation || '';
    optRows.innerHTML = '';
    if (q.type === 'truefalse') {
      if (q.answer === 0) document.getElementById('tfTrue').click();
      else document.getElementById('tfFalse').click();
    } else {
      (q.options || []).forEach(function (o, oi) {
        var correct = q.type === 'multiple' ? q.answer.indexOf(oi) >= 0 : q.answer === oi;
        addOptRow(o, correct);
      });
    }
    document.getElementById('formErr').hidden = true;
    syncTypeUI();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('resetBtn').onclick = resetForm;

  document.getElementById('saveBtn').onclick = async function () {
    var errBox = document.getElementById('formErr');
    errBox.hidden = true;
    var type = fType.value;

    // client-side validation: no empty options, at least 2, correct marked
    var rows = $$('.optrow');
    var opts = rows.map(function (r) { return r.querySelector('.optinput').value.trim(); });
    var marked = rows.map(function (r) { return r.querySelector('.markbtn').classList.contains('on'); });
    if (type !== 'truefalse') {
      if (opts.length < 2) { return showFormErr('Provide at least 2 options.'); }
      if (opts.some(function (o) { return !o; })) { return showFormErr('Option text cannot be empty — remove unused option rows.'); }
      if (type === 'single' && marked.indexOf(true) < 0) { return showFormErr('Click the ✓ circle next to the correct option.'); }
      if (type === 'multiple' && !marked.some(Boolean)) { return showFormErr('Mark at least one correct option with ✓.'); }
    }
    if (!fText.value.trim()) { return showFormErr('Question text cannot be empty.'); }

    var answer = type === 'truefalse' ? tfAnswer
      : type === 'single' ? marked.indexOf(true)
      : marked.map(function (m, i) { return m ? i : -1; }).filter(function (i) { return i >= 0; });


    var payload = {
      id: editingId || undefined,
      type: type,
      text: fText.value,
      options: opts,
      answer: answer,
      points: Number(fPoints.value) || 1,
      explanation: fExpl.value
    };
    var btn = this;
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      if (editingId) {
        var r = await PUT('/api/questions/' + editingId, payload);
        var i = questions.findIndex(function (q) { return q.id === editingId; });
        questions[i] = r.question;
        toast('Question updated');
      } else {
        var r2 = await POST('/api/quizzes/' + quizId + '/questions', payload);
        questions.push(r2.question);
        toast('Question added');
      }
      resetForm();
      renderList();
    } catch (err) {
      errBox.textContent = err.message;
      errBox.hidden = false;
    }
    btn.disabled = false; btn.textContent = 'Save question';
  };

  function showFormErr(msg) {
    var errBox = document.getElementById('formErr');
    errBox.textContent = msg;
    errBox.hidden = false;
    return false;
  }

  resetForm();
  renderList();
})().catch(function () {});
</script>
</body>
</html>
