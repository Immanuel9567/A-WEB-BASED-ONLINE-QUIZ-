<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class — ClassMark</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231a73e8'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="app">
<div id="nav"></div>

<main class="container">
  <section class="pagehead col">
    <div class="row headactions">
      <a class="btn" href="dashboard.html" id="backLink"></a>
      <button class="btn" id="clsSettings" hidden></button>
    </div>
    <div class="row" style="align-items:flex-end;flex-wrap:wrap;gap:16px">
      <div style="flex:1;min-width:230px">
        <h1 id="cTitle">Class</h1>
        <p class="sub" id="cMeta">Loading…</p>
      </div>
      <div id="headCode" hidden>
        <div class="small muted" style="margin-bottom:5px"><b>Class join code</b> — tap to copy</div>
        <div class="codebox"><span class="code codebig" id="cCode" style="font-size:26px;font-weight:700;cursor:pointer" title="Copy the join code"></span><button class="btn sm" id="copyCode"></button></div>
      </div>
    </div>
  </section>

  <section class="statgrid" id="stats"></section>

  <h2 class="sec" id="crsHead">Courses</h2>
  <section class="card tight" id="crsCard"><p class="small muted skeleton">Loading…</p></section>

  <h2 class="sec" id="quizHead">Class quizzes</h2>
  <section class="quizgrid" id="quizzes">
    <div class="card skeleton">Loading…</div>
  </section>

  <!-- teacher-owner: manage students -->
  <h2 class="sec" id="memHead" hidden>Manage students</h2>
  <section class="card tablecard" id="memCard" hidden>
    <table>
      <thead><tr>
        <th data-k="name">Student <span class="sarr"></span></th><th data-k="quizzes">Quizzes <span class="sarr"></span></th>
        <th data-k="attempts">Attempts <span class="sarr"></span></th><th data-k="avg">Average <span class="sarr"></span></th>
        <th data-k="best">Best <span class="sarr"></span></th><th data-k="active">Last activity <span class="sarr"></span></th>
        <th style="text-align:right">Actions</th>
      </tr></thead>
      <tbody id="mRows"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
    </table>
  </section>
  <p style="margin:26px 2px 50px"></p>
</main>

<!-- ============ class settings modal (owner) ============ -->
<div class="overlay" id="clsOverlay" hidden>
  <div class="modal">
    <h3>Class settings</h3>
    <div class="form-err" id="clsErr" hidden></div>
    <div class="field">
      <label for="clsNameInput">Class name</label>
      <input id="clsNameInput" type="text" placeholder="Class name">
    </div>
    <div class="field">
      <label>Class colour</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" id="clsCancel">Cancel</button>
      <button type="button" class="btn primary" id="clsSave">Save settings</button>
    </div>
  </div>
</div>

<!-- ============ course modal (owner) ============ -->
<div class="overlay" id="crsOverlay" hidden>
  <div class="modal">
    <h3>Rename course</h3>
    <div class="form-err" id="crsErr" hidden></div>
    <div class="field">
      <label for="crsNameInput">Course name</label>
      <input id="crsNameInput" type="text" placeholder="Course name">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" id="crsCancel">Cancel</button>
      <button type="button" class="btn primary" id="crsSave">Save</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
(async function () {
  var user = await requireLogin();
  var isTeacher = user.role === 'teacher';
  navbar(user, isTeacher ? 'dashboard' : 'class');

  var classId = new URLSearchParams(location.search).get('id');
  if (!classId) { location.href = isTeacher ? 'teacher.html' : 'dashboard.html'; return; }

  document.getElementById('backLink').innerHTML = icon('arrowLeft', 15) + (isTeacher ? ' Dashboard' : ' My dashboard');
  document.getElementById('backLink').href = isTeacher ? 'teacher.html' : 'dashboard.html';
  document.getElementById('copyCode').innerHTML = icon('clipboardCheck', 14) + ' Copy';
  document.getElementById('clsSettings').innerHTML = icon('sliders', 15) + ' Settings';

  var c = null, owner = false, d = null;
  var sortKey = 'active', sortDir = -1; // members table sorting (teacher)
  var MKEYS = {
    name: function (m) { return m.name.toLowerCase(); },
    quizzes: function (m) { return m.quizzesTaken; },
    attempts: function (m) { return m.attempts; },
    avg: function (m) { return m.avgPercent; },
    best: function (m) { return m.bestPercent; },
    active: function (m) { return m.lastActivity; }
  };
  function memberView() {
    var get = MKEYS[sortKey] || MKEYS.active;
    var isName = sortKey === 'name';
    return (d.members || []).slice().sort(function (a, b) {
      var va = get(a), vb = get(b);
      if (va == null && vb == null) return a.name.localeCompare(b.name);
      if (va == null) return 1;
      if (vb == null) return -1;
      var r = isName ? va.localeCompare(vb) : va - vb;
      return r * sortDir || a.name.localeCompare(b.name);
    });
  }
  function paintMemberArrows() {
    $$('#memCard th[data-k]').forEach(function (th) {
      var on = th.getAttribute('data-k') === sortKey;
      th.querySelector('.sarr').innerHTML = on ? icon(sortDir > 0 ? 'arrowUp' : 'arrowDown', 12) : '';
    });
  }
  var PALETTE = ['#1a73e8', '#188038', '#12b5cb', '#a142f4', '#ad1457', '#d93025', '#e8710a', '#f9ab00', '#5f6368'];
  var pickedColor = null;

  async function loadClassPage() {
    try { d = await GET('/api/classes/' + classId); }
    catch (err) { toast(err.message, 'bad'); setTimeout(function () { location.href = isTeacher ? 'teacher.html' : 'dashboard.html'; }, 1200); return; }
    c = d.class;
    owner = isTeacher && c.teacherId === user.id;

    document.getElementById('cTitle').innerHTML =
      (c.color ? '<span class="classdot big" style="background:' + esc(c.color) + '"></span> ' : '') + esc(c.name);
    document.getElementById('cMeta').textContent =
      'Taught by ' + c.teacherName + ' · ' + c.memberCount + ' member' + (c.memberCount === 1 ? '' : 's') +
      ' · ' + (d.courses || []).length + ' course' + ((d.courses || []).length === 1 ? '' : 's') +
      ' · ' + d.quizzes.length + ' class quiz' + (d.quizzes.length === 1 ? '' : 'zes');

    /* ---- owner extras: code card, settings button, manage students ---- */
    document.getElementById('clsSettings').hidden = !owner;
    document.getElementById('headCode').hidden = !owner;
    if (owner) {
      document.getElementById('cCode').textContent = c.code;
      document.getElementById('memHead').hidden = false;
      document.getElementById('memCard').hidden = false;
      var mb = document.getElementById('mRows');
      if (!d.members.length) {
        mb.innerHTML = '<tr><td colspan="7"><div class="empty"><div class="eico">' + icon('users', 34) + '</div>' +
          'No students have joined yet — share the code <b>&nbsp;' + esc(c.code) + '&nbsp;</b>with your class.</div></td></tr>';
      } else {
        mb.innerHTML = memberView().map(function (m) {
          return '<tr>' +
            '<td><b>' + esc(m.name) + '</b><br><span class="small muted">' + esc(m.email) + '</span></td>' +
            '<td>' + m.quizzesTaken + '</td>' +
            '<td>' + m.attempts + '</td>' +
            '<td>' + (m.avgPercent != null ? '<b>' + fmtPct(m.avgPercent) + '</b>' : '—') + '</td>' +
            '<td>' + (m.bestPercent != null ? fmtPct(m.bestPercent) : '—') + '</td>' +
            '<td class="small muted">' + (m.lastActivity ? fmtWhen(m.lastActivity) : '—') + '</td>' +
            '<td style="text-align:right;white-space:nowrap">' +
            '<a class="btn sm" href="students.html?id=' + m.id + '">' + icon('eye', 13) + ' History</a>' +
            '<button class="btn sm danger" data-kick="' + m.id + '" data-name="' + esc(m.name) + '">' + icon('x', 13) + ' Kick</button>' +
            '</td></tr>';
        }).join('');
        paintMemberArrows();
        $$('#memCard th[data-k]').forEach(function (th) {
          th.onclick = function () {
            var k = th.getAttribute('data-k');
            if (sortKey === k) sortDir = -sortDir;
            else { sortKey = k; sortDir = k === 'name' ? 1 : -1; }
            loadClassPage();
          };
        });
        wireKick();
      }
    }

    /* ---- stats ---- */
    var published = d.quizzes.filter(function (q) { return q.published; });
    var withAvg = published.filter(function (q) { return q.avgPercent != null; });
    var clsAvg = withAvg.length ? Math.round(withAvg.reduce(function (s, q) { return s + q.avgPercent; }, 0) / withAvg.length * 10) / 10 : null;
    document.getElementById('stats').innerHTML =
      stat(c.memberCount, 'Members') +
      stat(published.length, 'Published quizzes') +
      stat(d.quizzes.length, 'Total quizzes', true) +
      stat(fmtPct(clsAvg), 'Class average');
    function stat(v, l, acc) {
      return '<div class="stat' + (acc ? ' accent' : '') + '"><div class="num">' + v + '</div><div class="lbl">' + l + '</div></div>';
    }

    renderCourses();
    renderQuizzes();
  }

  /* ---- courses: everyone filters by tapping; the owner also creates / renames / deletes ---- */
  var crsFilter = null;
  function renderCourses() {
    var el = document.getElementById('crsCard');
    var list = d.courses || [];
    var chips = '<button class="chip" data-crs="" style="cursor:pointer">' + icon('fileText', 13) + ' All quizzes</button>' +
      list.map(function (x) {
        return '<button class="chip" data-crs="' + esc(x.id) + '" style="cursor:pointer;' + (crsFilter === x.id ? 'font-weight:700;text-decoration:underline' : '') + '">' +
          icon('bookOpen', 13) + ' ' + esc(x.name) + ' &middot; ' + x.quizCount + '</button>';
      }).join('');
    var html = '<div class="row" style="flex-wrap:wrap;gap:8px">' + chips + '</div>';
    if (owner) {
      html += '<div class="row" style="margin-top:14px;gap:10px;flex-wrap:wrap">' +
        '<input id="crsName" type="text" placeholder="New course" style="flex:1;min-width:180px">' +
        '<button class="btn primary" id="crsGo"></button></div>';
      html += list.map(function (x) {
        return '<div class="row clsrow" style="margin-top:10px;gap:10px">' +
          '<b style="min-width:150px">' + esc(x.name) + '</b>' +
          '<span class="small muted">' + x.quizCount + ' quiz' + (x.quizCount === 1 ? '' : 'zes') + '</span><span class="spacer"></span>' +
          '<button class="btn sm" data-ren="' + esc(x.id) + '" data-name="' + esc(x.name) + '">' + icon('edit', 13) + ' Rename</button>' +
          '<button class="btn sm danger" data-delc="' + esc(x.id) + '" data-name="' + esc(x.name) + '">' + icon('trash', 13) + '</button>' +
          '</div>';
      }).join('');
    }
    el.innerHTML = html;
    if (owner) {
      document.getElementById('crsGo').innerHTML = icon('plus', 14) + ' Create course';
      document.getElementById('crsGo').onclick = async function () {
        this.disabled = true;
        try {
          await POST('/api/classes/' + classId + '/courses', { name: document.getElementById('crsName').value });
          toast('Course created — students in this class get it automatically');
          await loadClassPage();
        } catch (err) { toast(err.message, 'bad'); this.disabled = false; }
      };
      $$('[data-ren]', el).forEach(function (b) {
        b.onclick = function () { openCourseModal(b.getAttribute('data-ren'), b.getAttribute('data-name')); };
      });
      $$('[data-delc]', el).forEach(function (b) {
        b.onclick = async function () {
          var name = b.getAttribute('data-name');
          var ok = await confirmModal({
            title: 'Delete "' + name + '"?',
            body: 'The course is removed from this class. Quizzes still inside it must be deleted or moved first.',
            okText: 'Delete course', danger: true
          });
          if (!ok) return;
          try { await DEL('/api/courses/' + b.getAttribute('data-delc')); toast('Course deleted'); await loadClassPage(); }
          catch (err) { toast(err.message, 'bad'); }
        };
      });
    }
    $$('[data-crs]', el).forEach(function (b) {
      b.onclick = function () {
        crsFilter = b.getAttribute('data-crs') || null;
        renderCourses();
        renderQuizzes();
      };
    });
  }

  /* ---- quizzes of the class (optionally filtered to one course) ---- */
  function renderQuizzes() {
    var qEl = document.getElementById('quizzes');
    var shown = crsFilter ? d.quizzes.filter(function (q) { return q.course && q.course.id === crsFilter; }) : d.quizzes;
    if (!d.quizzes.length) {
      qEl.innerHTML = '<div class="card"><div class="empty"><div class="eico">' + icon('fileText', 34) + '</div>' +
        (owner ? 'No quizzes in this class yet — create a course above, then add quizzes to it from Create quiz.' : 'Your teacher has not added class quizzes yet. Check back soon.') + '</div></div>';
    } else if (!shown.length) {
      qEl.innerHTML = '<div class="card"><div class="empty"><div class="eico">' + icon('fileText', 34) + '</div>' +
        'No quizzes in this course yet.</div></div>';
    } else {
      qEl.innerHTML = shown.map(card).join('');
      wireStart();
    }
  }

  function card(q) {
    var actions = '';
    var win = winState(q);
    if (owner) {
      actions = '<div class="row btnrow">' +
        '<a class="btn sm" href="builder.html?id=' + q.id + '">' + icon('edit', 13) + ' Questions</a>' +
        '<a class="btn sm primary" href="insights.html?id=' + q.id + '">' + icon('barChart', 13) + ' Insights</a></div>' +
        (q.opensAt || q.closesAt ? '<div class="row small muted" style="margin-top:8px">' + icon('timer', 14) + ' ' +
          (win === 'upcoming' ? 'opens ' + fmtWhen(q.opensAt) : win === 'closed' ? 'closed ' + fmtWhen(q.closesAt) : 'closes ' + fmtWhen(q.closesAt)) + '</div>' : '');
    } else if (q.inProgressAttemptId) {
      actions = '<a class="btn primary block" href="quiz.html?attempt=' + q.inProgressAttemptId + '">' + icon('chevronRight', 15) + ' Resume attempt</a>';
    } else if (win === 'upcoming') {
      actions = '<span class="badge plain">Not open yet — opens ' + fmtWhen(q.opensAt) + '</span>';
    } else if (win === 'closed') {
      actions = '<span class="badge warn">Closed ' + fmtWhen(q.closesAt) + '</span>';
    } else if (q.attemptsUsed >= q.attemptsAllowed) {
      actions = '<span class="badge plain">No attempts left</span>';
    } else if (!q.questionCount) {
      actions = '<span class="badge plain">No questions yet</span>';
    } else {
      actions = '<button class="btn primary block" data-start="' + q.id + '">' + (q.attemptsUsed ? 'Retake quiz' : 'Start quiz') + '</button>';
    }
    var outcome = '';
    if (!owner && q.bestPercent != null) {
      outcome = '<span class="badge ' + (q.bestPassed ? 'ok' : 'bad') + '">' +
        (q.bestPassed ? 'Passed' : 'Failed') + ' · best ' + fmtPct(q.bestPercent) + '</span>';
    }
    if (owner) {
      outcome = q.published ? '<span class="badge ok">Published</span>' : '<span class="badge plain">Draft</span>';
    }
    var tint = c && c.color ? ' style="--cc:' + esc(c.color) + '"' : '';
    return '' +
      '<div class="card hover classcard"' + tint + '>' +
      '<div class="row" style="margin-bottom:9px"><span class="chip">' + icon('fileText', 13) + ' ' + esc(q.subject) + '</span>' +
      '<span class="chip classchip">' + (c && c.color ? '<span class="classdot" style="background:' + esc(c.color) + '"></span>' : '') + esc(c.name) + '</span>' +
      (q.course && String(q.course.name).toLowerCase() !== String(q.subject || '').toLowerCase()
        ? '<span class="chip">' + icon('bookOpen', 13) + ' ' + esc(q.course.name) + '</span>' : '') +
      '<span class="spacer"></span>' + outcome + '</div>' +
      '<h3 style="font-size:18.5px">' + esc(q.title) + '</h3>' +
      '<p class="muted small" style="min-height:38px">' + esc(q.description || '') + '</p>' +
      '<div class="row small muted" style="margin-bottom:12px">' +
      '<span>' + icon('timer', 14) + ' ' + q.durationMin + ' min</span>' +
      '<span>' + icon('helpCircle', 14) + ' ' + q.questionCount + ' questions</span>' +
      '<span>' + icon('flag', 14) + ' pass ' + q.passMark + '%</span>' +
      '</div>' +
      '<div class="row small muted" style="margin-bottom:16px">Attempts used: <b>&nbsp;' + q.attemptsUsed + '/' + q.attemptsAllowed + '</b></div>' +
      actions +
      '</div>';
  }

  function wireStart() {
    $$('#quizzes [data-start]').forEach(function (btn) {
      btn.onclick = async function () {
        btn.disabled = true; btn.textContent = 'Starting…';
        try {
          var r = await POST('/api/attempts', { quizId: btn.getAttribute('data-start') });
          location.href = 'quiz.html?attempt=' + r.attempt.id;
        } catch (err) { toast(err.message, 'bad'); btn.disabled = false; btn.textContent = 'Start quiz'; }
      };
    });
  }

  /* ---- kick a student out of the class ---- */
  function wireKick() {
    $$('[data-kick]').forEach(function (b) {
      b.onclick = async function () {
        var name = b.getAttribute('data-name');
        var ok = await confirmModal({
          title: 'Remove ' + name + ' from this class?',
          body: 'They lose access to this class\'s quizzes immediately. Their past results are kept.',
          okText: 'Remove from class', danger: true
        });
        if (!ok) return;
        b.disabled = true;
        try {
          await POST('/api/classes/' + classId + '/kick', { studentId: b.getAttribute('data-kick') });
          toast(name + ' removed from the class');
          loadClassPage();
        } catch (err) { toast(err.message, 'bad'); b.disabled = false; }
      };
    });
  }

  /* ---- class settings: colour + rename ---- */
  var ov = document.getElementById('clsOverlay');
  document.getElementById('clsSettings').onclick = function () {
    pickedColor = c.color || null;
    document.getElementById('clsNameInput').value = c.name;
    document.getElementById('clsErr').hidden = true;
    renderSwatches();
    ov.hidden = false;
  };
  document.getElementById('clsCancel').onclick = function () { ov.hidden = true; };
  ov.onclick = function (e) { if (e.target === ov) ov.hidden = true; };
  function renderSwatches() {
    var box = document.getElementById('swatches');
    box.innerHTML = PALETTE.map(function (col) {
      return '<button type="button" class="swatch' + (pickedColor === col ? ' on' : '') + '" data-col="' + col + '" style="background:' + col + '" title="' + col + '"></button>';
    }).join('');
    $$('[data-col]', box).forEach(function (b) {
      b.onclick = function () { pickedColor = b.getAttribute('data-col'); renderSwatches(); };
    });
  }
  document.getElementById('clsSave').onclick = async function () {
    var btn = this;
    var err = document.getElementById('clsErr');
    err.hidden = true;
    btn.disabled = true;
    try {
      await PUT('/api/classes/' + classId, {
        name: document.getElementById('clsNameInput').value,
        color: pickedColor || '#1a73e8'
      });
      toast('Class settings saved');
      ov.hidden = true;
      loadClassPage();
    } catch (e2) {
      err.innerHTML = icon('alertCircle', 16) + '<span>' + esc(e2.message) + '</span>';
      err.hidden = false;
    }
    btn.disabled = false;
  };

  document.getElementById('copyCode').onclick = function () { copyText(c.code, 'Class code copied'); };
  document.getElementById('cCode').onclick = function () { copyText(c.code, 'Class code copied'); };

  /* ---- course rename modal ---- */
  var crsOv = document.getElementById('crsOverlay');
  var crsEditId = null;
  function openCourseModal(id, name) {
    crsEditId = id;
    document.getElementById('crsNameInput').value = name;
    document.getElementById('crsErr').hidden = true;
    crsOv.hidden = false;
  }
  document.getElementById('crsCancel').onclick = function () { crsOv.hidden = true; };
  crsOv.onclick = function (e) { if (e.target === crsOv) crsOv.hidden = true; };
  document.getElementById('crsSave').onclick = async function () {
    var btn = this;
    var err = document.getElementById('crsErr');
    err.hidden = true;
    btn.disabled = true;
    try {
      await PUT('/api/courses/' + crsEditId, { name: document.getElementById('crsNameInput').value });
      toast('Course renamed');
      crsOv.hidden = true;
      await loadClassPage();
    } catch (e2) {
      err.innerHTML = icon('alertCircle', 16) + '<span>' + esc(e2.message) + '</span>';
      err.hidden = false;
    }
    btn.disabled = false;
  };

  loadClassPage();
})().catch(function () {});
</script>
</body>
</html>
