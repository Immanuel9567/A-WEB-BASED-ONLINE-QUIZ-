<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher dashboard — ClassMark</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preload" href="fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231a73e8'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="app">
<div id="nav"></div>

<main class="container">
  <section class="pagehead">
    <div>
      <h1>Teacher dashboard</h1>
      <p class="sub" id="welcome">Loading…</p>
    </div>
  </section>

  <section class="statgrid" id="stats"></section>

  <section class="card tight" id="classCard"><p class="small muted skeleton">Loading…</p></section>

  <div class="row qzbar">
    <h2 class="sec" style="margin:0">My quizzes</h2>
    <span class="spacer"></span>
    <div class="qz-search"><span class="qs-ic" id="qsIco"></span><input id="qzSearch" type="text" placeholder="Search quizzes" autocomplete="off"></div>
    <select id="qzClassFilter" style="width:200px" title="Filter by class"></select>
  </div>
  <section class="card tablecard">
    <table>
      <thead><tr>
        <th>Quiz</th>
        <th id="statusTh" class="sortable">Status <span class="sarr"></span></th>
        <th class="sortable" data-k="questions">Questions <span class="sarr"></span></th>
        <th class="sortable" data-k="duration">Duration <span class="sarr"></span></th>
        <th class="sortable" data-k="pass">Pass <span class="sarr"></span></th>
        <th class="sortable" data-k="attempts">Attempts <span class="sarr"></span></th>
        <th>Average</th><th style="text-align:right">Actions</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
    </table>
  </section>
</main>

<script src="js/app.js"></script>
<script>
(async function () {
  var user = await requireLogin('teacher');
  navbar(user, 'dashboard');
  document.getElementById('welcome').textContent =
    'Welcome, ' + user.name + ' — build quizzes, monitor sessions live and review analytics.';

  var quizzes = [], students = [];

  /* ---- stats + table re-render in place after every change — no page refresh ---- */
  async function refresh() {
    var results = await Promise.all([GET('/api/quizzes'), GET('/api/students')]);
    quizzes = results[0].quizzes;
    students = results[1].students; // only students enrolled in my classes
    renderStats();
    renderTable();
  }
  function renderStats() {
    var totalAttempts = quizzes.reduce(function (s, q) { return s + q.attemptCount; }, 0);
    var withAvg = quizzes.filter(function (q) { return q.avgPercent != null; });
    var overallAvg = withAvg.length
      ? Math.round(withAvg.reduce(function (s, q) { return s + q.avgPercent; }, 0) / withAvg.length * 10) / 10
      : null;
    var t = Date.now();
    var scheduled = quizzes.filter(function (q) { return q.published && q.opensAt && q.opensAt > t; }).length;
    var expired = quizzes.filter(function (q) { return q.published && q.closesAt && q.closesAt <= t; }).length;
    var active = quizzes.filter(function (q) {
      return q.published && !(q.opensAt && q.opensAt > t) && !(q.closesAt && q.closesAt <= t);
    }).length;
    document.getElementById('stats').innerHTML =
      st(quizzes.length, 'Quizzes created') +
      st(active, 'Active quizzes') +
      st(scheduled, 'Scheduled quizzes') +
      st(expired, 'Expired quizzes') +
      stLink(students.length, 'My students', 'students.html', 'View list') +
      st(totalAttempts, 'Attempts') +
      st(fmtPct(overallAvg), 'Average score', true);
  }
  function st(v, l, acc) {
    return '<div class="stat' + (acc ? ' accent' : '') + '"><div class="num">' + v + '</div><div class="lbl">' + l + '</div></div>';
  }
  function stLink(v, l, href, action) {
    return '<a class="stat" href="' + href + '"><div class="num">' + v + '</div><div class="lbl">' + l + ' &middot; ' + action + '</div></a>';
  }

  /* ---- table ---- */
  var tb = document.getElementById('rows');
  function renderTable() {
    if (!quizzes.length) {
      tb.innerHTML = '<tr><td colspan="8"><div class="empty"><div class="eico">' + icon('fileText', 34) + '</div>' +
        'No quizzes yet — use Create quiz in the menu.</div></td></tr>';
      return;
    }
    var list = quizzes.filter(function (q) {
      if (qzCls && !(q.classInfo || []).some(function (c) { return c.id === qzCls; })) return false;
      if (qzStatus && statusOf(q) !== qzStatus) return false;
      if (qzSearch) {
        var hay = (q.title + ' ' + q.subject + ' ' + (q.classInfo || []).map(function (c) { return c.name; }).join(' ')).toLowerCase();
        if (hay.indexOf(qzSearch) < 0) return false;
      }
      return true;
    });
    if (qzSortKey) {
      var get = SORT_KEYS[qzSortKey];
      var m = qzSortDir === 1 ? -1 : 1;
      list.sort(function (a, b) {
        return (get(b) - get(a) || a.title.localeCompare(b.title)) * m;
      });
    }
    paintSortArrows();
    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="8"><div class="empty"><div class="eico">' + icon('search', 30) + '</div>' +
        'No quizzes match these filters.</div></td></tr>';
      return;
    }
    tb.innerHTML = list.map(row).join('');
    wire();
  }

  /* ---- my-quizzes toolbar: search, class filter, status popup, sorting ---- */
  var qzSearch = '', qzCls = '', qzStatus = '';
  var qzSortKey = '', qzSortDir = -1; // first click sorts biggest-first, second click reverses
  var SORT_KEYS = {
    questions: function (q) { return q.questionCount; },
    duration: function (q) { return q.durationMin; },
    pass: function (q) { return q.passMark; },
    attempts: function (q) { return q.attemptCount; }
  };
  function statusOf(q) { // one status per quiz — matches the badge shown in the row
    var t = Date.now();
    if (!q.published) return 'draft';
    if (q.opensAt && t < q.opensAt) return 'scheduled';
    if (q.closesAt && t >= q.closesAt) return 'expired';
    return 'ongoing';
  }
  document.getElementById('qsIco').innerHTML = icon('search', 15);
  document.getElementById('qzSearch').oninput = function () {
    qzSearch = this.value.trim().toLowerCase();
    renderTable();
  };
  var selQzCls = document.getElementById('qzClassFilter');
  selQzCls.innerHTML = '<option value="">All classes</option>';
  selQzCls.onchange = function () { qzCls = this.value; renderTable(); };

  /* status filter — themed popup under the column title (fixed, so the table's
     overflow-x scroll container can never clip it) */
  var statusTh = document.getElementById('statusTh');
  var statusMenu = document.createElement('div');
  statusMenu.className = 'dd-menu qz-status-menu';
  statusMenu.setAttribute('role', 'listbox');
  statusMenu.hidden = true;
  document.body.appendChild(statusMenu);
  var STATUSES = [
    { v: '', l: 'All statuses' },
    { v: 'ongoing', l: 'Ongoing' },
    { v: 'scheduled', l: 'Scheduled' },
    { v: 'expired', l: 'Expired' },
    { v: 'draft', l: 'Draft' }
  ];
  function paintStatusTh() {
    statusTh.querySelector('.sarr').innerHTML = icon('chevronDown', 12);
    statusTh.classList.toggle('on', !!qzStatus || !statusMenu.hidden);
  }
  function closeStatusMenu() { statusMenu.hidden = true; paintStatusTh(); }
  statusTh.onclick = function () {
    if (statusMenu.hidden) {
      statusMenu.innerHTML = STATUSES.map(function (s) {
        return '<button type="button" class="dd-item' + (qzStatus === s.v ? ' on' : '') + '" data-st="' + s.v + '" role="option">' +
          '<span class="dd-txt">' + s.l + '</span>' + (qzStatus === s.v ? icon('check', 15) : '') + '</button>';
      }).join('');
      var r = statusTh.getBoundingClientRect();
      statusMenu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 200)) + 'px';
      statusMenu.style.top = (r.bottom + 6) + 'px';
      statusMenu.hidden = false;
      paintStatusTh();
    } else closeStatusMenu();
  };
  statusMenu.addEventListener('click', function (e) {
    var b = e.target.closest('.dd-item');
    if (!b) return;
    qzStatus = b.getAttribute('data-st');
    closeStatusMenu();
    renderTable();
  });
  document.addEventListener('click', function (e) {
    if (!statusMenu.hidden && !statusTh.contains(e.target) && !statusMenu.contains(e.target)) closeStatusMenu();
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !statusMenu.hidden) closeStatusMenu(); });
  document.addEventListener('scroll', function () { if (!statusMenu.hidden) closeStatusMenu(); }, true);
  paintStatusTh();

  /* numeric column sorting */
  $$('.tablecard th[data-k]').forEach(function (th) {
    th.onclick = function () {
      var k = th.getAttribute('data-k');
      if (qzSortKey === k) qzSortDir = -qzSortDir;
      else { qzSortKey = k; qzSortDir = -1; }
      renderTable();
    };
  });
  function paintSortArrows() {
    $$('.tablecard th[data-k]').forEach(function (th) {
      var on = th.getAttribute('data-k') === qzSortKey;
      th.querySelector('.sarr').innerHTML = on ? icon(qzSortDir > 0 ? 'arrowUp' : 'arrowDown', 12) : '';
    });
  }
  try { await refresh(); }
  catch (e) {
    document.getElementById('rows').innerHTML =
      '<tr><td colspan="8" class="muted">Could not load your quizzes — ' + esc(e.message) + '</td></tr>';
  }

  function winLabel(q) {
    var t = Date.now();
    if (q.opensAt && t < q.opensAt) return 'Opens ' + fmtWhen(q.opensAt);
    if (q.closesAt && t > q.closesAt) return 'Closed ' + fmtWhen(q.closesAt);
    if (q.closesAt) return 'Closes ' + fmtWhen(q.closesAt);
    return 'Opens ' + fmtWhen(q.opensAt);
  }
  function row(q) {
    var qCell = '<b>' + esc(q.title) + '</b><br><span class="small muted">' + esc(q.subject) + '</span>';
    if (q.draftCount > 0) qCell += ' <span class="chip">' + q.draftCount + ' draft' + (q.draftCount > 1 ? 's' : '') + '</span>';
    (q.classInfo || []).forEach(function (c) {
      qCell += ' <span class="chip classchip">' + (c.color ? '<span class="classdot" style="background:' + esc(c.color) + '"></span>' : '') + esc(c.name) + '</span>';
    });
    if (!(q.classInfo || []).length) qCell += ' <span class="chip">No class — students cannot see it</span>';
    return '<tr>' +
      '<td>' + qCell + '</td>' +
      '<td>' + (q.published ? '<span class="badge ok">Published</span>' : '<span class="badge plain">Draft</span>') +
        (q.opensAt || q.closesAt ? '<br><span class="small muted">' + winLabel(q) + '</span>' : '') + '</td>' +
      '<td>' + q.questionCount + ' <span class="small muted">(' + q.totalPoints + ' pts)</span></td>' +
      '<td>' + q.durationMin + ' min</td>' +
      '<td>' + q.passMark + '%</td>' +
      '<td>' + q.attemptCount + '</td>' +
      '<td>' + (q.avgPercent != null ? '<b>' + fmtPct(q.avgPercent) + '</b>' : '—') + '</td>' +
      '<td class="actions" style="text-align:right;white-space:nowrap">' +
      '<a class="btn sm" href="builder.html?id=' + q.id + '">' + icon('edit', 14) + ' Questions</a>' +
      '<a class="btn sm primary" href="insights.html?id=' + q.id + '">' + icon('barChart', 14) + ' View and manage</a>' +
      '<button class="btn sm" data-pub="' + q.id + '">' + (q.published ? icon('globe', 14) + ' Unpublish' : icon('send', 14) + ' Publish') + '</button>' +
      '<button class="btn sm danger" data-del="' + q.id + '">' + icon('trash', 14) + '</button>' +
      '</td></tr>';
  }

  function wire() {
    $$('[data-pub]').forEach(function (b) {
      b.onclick = async function () {
        b.disabled = true;
        var q = quizzes.find(function (x) { return x.id === b.getAttribute('data-pub'); });
        try {
          var r = await PUT('/api/quizzes/' + q.id, { published: !q.published });
          q.published = r.quiz.published;
          toast(q.published ? 'Quiz published — students were notified' : 'Quiz unpublished — hidden from students');
          renderStats();
          renderTable();
        } catch (err) { toast(err.message, 'bad'); b.disabled = false; }
      };
    });
    $$('[data-del]').forEach(function (b) {
      b.onclick = async function () {
        var q = quizzes.find(function (x) { return x.id === b.getAttribute('data-del'); });
        var ok = await confirmModal({
          title: 'Delete "' + q.title + '"?',
          body: 'This permanently removes the quiz, its questions and <b>' + q.attemptCount + '</b> attempt records.',
          okText: 'Delete permanently', danger: true
        });
        if (!ok) return;
        try {
          await DEL('/api/quizzes/' + q.id);
          toast('Quiz deleted');
          quizzes = quizzes.filter(function (x) { return x.id !== q.id; });
          renderStats();
          renderTable();
        } catch (err) { toast(err.message, 'bad'); }
      };
    });
  }

  /* ---- quick settings: create class, manage classes, codes with tap-to-copy ---- */
  var classCard = document.getElementById('classCard');
  async function loadClasses() {
    try {
      var d = await GET('/api/classes/mine');
      var list = d.classes || [];
      selQzCls.innerHTML = '<option value="">All classes</option>' + list.map(function (c) {
        return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
      }).join('');
      if (list.some(function (c) { return c.id === qzCls; })) selQzCls.value = qzCls; else qzCls = '';
      var rows = list.map(function (c) {
        return '<div class="row clsrow" style="margin-bottom:10px">' +
          (c.color ? '<span class="classdot big" style="background:' + esc(c.color) + '"></span>' : '') +
          '<div style="flex:1;min-width:150px"><b>' + esc(c.name) + '</b>' +
          '<div class="hintline">' + c.memberCount + ' member' + (c.memberCount === 1 ? '' : 's') + ' &middot; ' + c.courseCount + ' course' + (c.courseCount === 1 ? '' : 's') + '</div></div>' +
          '<button class="btn sm" data-copy="' + esc(c.code) + '" title="Tap to copy the join code"><b class="mono codebig">' + esc(c.code) + '</b></button>' +
          '<a class="btn sm primary" href="class.html?id=' + c.id + '">' + icon('chevronRight', 13) + ' Open</a>' +
          '</div>';
      }).join('');
      classCard.innerHTML =
        '<div class="row" style="flex-wrap:wrap;gap:10px;margin-bottom:12px">' +
        '<b style="font-size:16.5px">Quick settings</b><span class="spacer"></span>' +
        '<button class="btn sm primary" id="clsNew">' + icon('plus', 14) + ' Create class</button>' +
        (list.length > 1 ? '<a class="btn sm" href="classes.html">' + icon('sliders', 14) + ' Manage classes</a>' : '') +
        '</div>' +
        '<div class="row" id="clsNewRow" hidden style="margin-bottom:12px;gap:10px;flex-wrap:wrap">' +
        '<input id="clsName" type="text" placeholder="New class name" style="flex:1;min-width:170px">' +
        '<button class="btn primary" id="clsGo"></button>' +
        '<button class="btn" id="clsCancelNew">Cancel</button>' +
        '</div>' +
        '<div class="small muted" style="margin:0 0 10px"><b>My classes</b></div>' +
        (rows || '<p class="small muted" style="margin:0">No classes yet — create one above.</p>');
      var newRow = document.getElementById('clsNewRow');
      document.getElementById('clsNew').onclick = function () {
        newRow.hidden = !newRow.hidden;
        if (!newRow.hidden) document.getElementById('clsName').focus();
      };
      document.getElementById('clsCancelNew').onclick = function () { newRow.hidden = true; };
      document.getElementById('clsGo').innerHTML = icon('plus', 15) + ' Create class';
      document.getElementById('clsGo').onclick = async function () {
        this.disabled = true;
        try {
          var r = await POST('/api/classes', { name: document.getElementById('clsName').value });
          toast('Class created — share code ' + r.class.code + ' with your students');
          loadClasses();
        } catch (err) { toast(err.message, 'bad'); this.disabled = false; }
      };
      $$('[data-copy]', classCard).forEach(function (b) {
        b.onclick = function () { copyText(b.getAttribute('data-copy'), 'Class code copied'); };
      });
    } catch (err) {
      classCard.innerHTML = '<p class="small muted">Could not load classes.</p>';
    }
  }
  loadClasses();


})().catch(function () {});
</script>
</body>
</html>
