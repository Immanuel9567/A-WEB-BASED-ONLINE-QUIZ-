<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher dashboard — OQAS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231a73e8'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="app">
<div id="nav"></div>

<main class="container">
  <section class="pagehead">
    <div>
      <h1>Teacher dashboard</h1>
      <p class="sub" id="welcome">Loading…</p>
    </div>
  </section>

  <section class="statgrid" id="stats"></section>

__X__
  <section class="card tight" id="classCard"><p class="small muted skeleton">Loading…</p></section>

  <h2 class="sec">My quizzes</h2>
  <section class="card tablecard">
    <table>
      <thead><tr>
        <th>Quiz</th><th>Status</th><th>Questions</th><th>Duration</th><th>Pass</th>
        <th>Attempts</th><th>Average</th><th style="text-align:right">Actions</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
    </table>
  </section>
    <h2 class="sec">Data, cloud &amp; backup</h2>
  <section class="card tight">
    <div id="cloudBox"><p class="small muted skeleton">Loading cloud status…</p></div>
    <div class="row" style="align-items:flex-start;border-top:1px solid #e8eaed;padding-top:14px;margin-top:14px">
      <div style="flex:1;min-width:260px">
        <b style="font-size:15px">Local backup file</b>
        <p class="small muted" style="margin:4px 0 0">
          Download the whole database as a JSON file, or restore one — handy for moving to another server.
        </p>
      </div>
      <div class="row">
        <button class="btn" id="dlBackup"></button>
        <button class="btn" id="restoreBtn"></button>
        <input type="file" id="restoreFile" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>
</main></main>

<script src="js/app.js"></script>
<script>
(async function () {
  var user = await requireLogin('teacher');
  navbar(user, 'dashboard');
  document.getElementById('welcome').textContent =
    'Welcome, ' + user.name + ' — build quizzes, monitor sessions live and review analytics.';

  var quizzes = [], students = [];

  /* ---- stats + table re-render in place after every change — no page refresh ---- */
  async function refresh() {
    var results = await Promise.all([GET('/api/quizzes'), GET('/api/users')]);
    quizzes = results[0].quizzes;
    students = results[1].users.filter(function (u) { return u.role === 'student'; });
    renderStats();
    renderTable();
  }
  function renderStats() {
    var totalAttempts = quizzes.reduce(function (s, q) { return s + q.attemptCount; }, 0);
    var withAvg = quizzes.filter(function (q) { return q.avgPercent != null; });
    var overallAvg = withAvg.length
      ? Math.round(withAvg.reduce(function (s, q) { return s + q.avgPercent; }, 0) / withAvg.length * 10) / 10
      : null;
    document.getElementById('stats').innerHTML =
      st(quizzes.length, 'Quizzes created') +
      stLink(students.length, 'Enrolled students', 'students.html', 'View list') +
      st(totalAttempts, 'Attempts (incl. live)') +
      st(fmtPct(overallAvg), 'Average score', true);
  }
  function st(v, l, acc) {
    return '<div class="stat' + (acc ? ' accent' : '') + '"><div class="num">' + v + '</div><div class="lbl">' + l + '</div></div>';
  }
  function stLink(v, l, href, action) {
    return '<a class="stat" href="' + href + '"><div class="num">' + v + '</div><div class="lbl">' + l + ' &middot; ' + action + '</div></a>';
  }

  /* ---- table ---- */
  var tb = document.getElementById('rows');
  function renderTable() {
    if (!quizzes.length) {
      tb.innerHTML = '<tr><td colspan="8"><div class="empty"><div class="eico">' + icon('fileText', 34) + '</div>' +
        'No quizzes yet — use Create quiz in the sidebar.</div></td></tr>';
    } else {
      tb.innerHTML = quizzes.map(row).join('');
      wire();
    }
  }
  await refresh();

  function row(q) {
    var qCell = '<b>' + esc(q.title) + '</b><br><span class="small muted">' + esc(q.subject) + '</span>';
    if (q.draftCount > 0) qCell += ' <span class="chip">' + q.draftCount + ' draft' + (q.draftCount > 1 ? 's' : '') + '</span>';
    if (q.classes && q.classes.length) qCell += ' <span class="chip">My class only</span>';
    return '<tr>' +
      '<td>' + qCell + '</td>' +
      '<td>' + (q.published ? '<span class="badge ok">Published</span>' : '<span class="badge plain">Draft</span>') + '</td>' +
      '<td>' + q.questionCount + ' <span class="small muted">(' + q.totalPoints + ' pts)</span></td>' +
      '<td>' + q.durationMin + ' min</td>' +
      '<td>' + q.passMark + '%</td>' +
      '<td>' + q.attemptCount + '</td>' +
      '<td>' + (q.avgPercent != null ? '<b>' + fmtPct(q.avgPercent) + '</b>' : '—') + '</td>' +
      '<td class="actions" style="text-align:right;white-space:nowrap">' +
      '<a class="btn sm" href="builder.html?id=' + q.id + '">' + icon('edit', 14) + ' Questions</a>' +
      '<a class="btn sm primary" href="insights.html?id=' + q.id + '">' + icon('barChart', 14) + ' Insights</a>' +
      '<button class="btn sm" data-pub="' + q.id + '">' + (q.published ? icon('globe', 14) + ' Unpublish' : icon('send', 14) + ' Publish') + '</button>' +
      '<button class="btn sm danger" data-del="' + q.id + '">' + icon('trash', 14) + '</button>' +
      '</td></tr>';
  }

  function wire() {
    $$('[data-pub]').forEach(function (b) {
      b.onclick = async function () {
        b.disabled = true;
        var q = quizzes.find(function (x) { return x.id === b.getAttribute('data-pub'); });
        try {
          var r = await PUT('/api/quizzes/' + q.id, { published: !q.published });
          q.published = r.quiz.published;
          toast(q.published ? 'Quiz published — students were notified' : 'Quiz unpublished — hidden from students');
          renderStats();
          renderTable();
        } catch (err) { toast(err.message, 'bad'); b.disabled = false; }
      };
    });
    $$('[data-del]').forEach(function (b) {
      b.onclick = async function () {
        var q = quizzes.find(function (x) { return x.id === b.getAttribute('data-del'); });
        var ok = await confirmModal({
          title: 'Delete "' + q.title + '"?',
          body: 'This permanently removes the quiz, its questions and <b>' + q.attemptCount + '</b> attempt records.',
          okText: 'Delete permanently', danger: true
        });
        if (!ok) return;
        try {
          await DEL('/api/quizzes/' + q.id);
          toast('Quiz deleted');
          quizzes = quizzes.filter(function (x) { return x.id !== q.id; });
          renderStats();
          renderTable();
        } catch (err) { toast(err.message, 'bad'); }
      };
    });
  }

  /* ---- data backup & restore ---- */
  var dlB = document.getElementById('dlBackup');
  dlB.innerHTML = icon('download', 15) + ' Download backup';
  document.getElementById('restoreBtn').innerHTML = icon('upload', 15) + ' Restore backup';
  dlB.onclick = async function () {
    try {
      var data = await GET('/api/admin/export');
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var aEl = document.createElement('a');
      aEl.href = URL.createObjectURL(blob);
      aEl.download = 'oqas-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(aEl); aEl.click(); aEl.remove();
      toast('Backup downloaded — keep it somewhere safe');
    } catch (err) { toast(err.message, 'bad'); }
  };
  document.getElementById('restoreBtn').onclick = function () { document.getElementById('restoreFile').click(); };
  document.getElementById('restoreFile').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = async function () {
      var ok = await confirmModal({
        title: 'Restore database from backup?',
        body: 'This replaces ALL current data — users, quizzes, questions and results — with the contents of the backup file. Other users will be signed out.',
        okText: 'Restore database', danger: true
      });
      if (!ok) return;
      try {
        var parsed = JSON.parse(reader.result);
        var r = await POST('/api/admin/import', parsed);
        toast('Database restored — ' + r.quizzes + ' quizzes, ' + r.users + ' users, ' + r.attempts + ' attempts');
        await refresh();
        loadClasses();
      } catch (err) { toast(err.message, 'bad'); }
    };
    reader.readAsText(f);
    this.value = '';
  };

  /* ---- my classes (multi) ---- */
  var classCard = document.getElementById('classCard');
  async function loadClasses() {
    try {
      var d = await GET('/api/classes/mine');
      var list = d.classes || [];
      var rows = list.map(function (c) {
        return '<div class="row clsrow" style="margin-bottom:10px">' +
          (c.color ? '<span class="classdot big" style="background:' + esc(c.color) + '"></span>' : '') +
          '<div style="flex:1;min-width:160px"><b>' + esc(c.name) + '</b>' +
          '<div class="hintline">Code <b class="mono">' + esc(c.code) + '</b> &middot; ' + c.memberCount + ' member' + (c.memberCount === 1 ? '' : 's') + '</div></div>' +
          '<button class="btn sm" data-copy="' + esc(c.code) + '">' + icon('clipboardCheck', 13) + ' Copy code</button>' +
          '<a class="btn sm primary" href="class.html?id=' + c.id + '">' + icon('users', 13) + ' Open</a>' +
          '</div>';
      }).join('');
      classCard.innerHTML =
        '<div class="row" style="flex-wrap:wrap;align-items:flex-start">' +
        '<div style="flex:1;min-width:260px">' +
        (rows || '<p class="small muted" style="margin:0 0 6px">No classes yet — your first class gets a unique join code students use to join.</p>') +
        '</div>' +
        '<div class="row"><input id="clsName" type="text" placeholder="New class name…" style="min-width:160px">' +
        '<button class="btn primary" id="clsGo"></button></div>' +
        '</div>';
      document.getElementById('clsGo').innerHTML = icon('plus', 15) + ' Add class';
      document.getElementById('clsGo').onclick = async function () {
        this.disabled = true;
        try {
          var r = await POST('/api/classes', { name: document.getElementById('clsName').value });
          toast('Class created — share code ' + r.class.code + ' with your students');
          loadClasses();
        } catch (err) { toast(err.message, 'bad'); this.disabled = false; }
      };
      $$('[data-copy]', classCard).forEach(function (b) {
        b.onclick = function () {
          try { navigator.clipboard.writeText(b.getAttribute('data-copy')); toast('Class code copied — ' + b.getAttribute('data-copy')); }
          catch (e) { toast('Class code: ' + b.getAttribute('data-copy'), 'info'); }
        };
      });
    } catch (err) {
      classCard.innerHTML = '<p class="small muted">Could not load classes.</p>';
    }
  }
  loadClasses();

  /* ---- cloud save ---- */
  var cloudBox = document.getElementById('cloudBox');
  function paintCloud(st) {
    if (!st.connected) {
      cloudBox.innerHTML =
        '<b style="font-size:15px">Cloud save — not connected</b>' +
        '<p class="small muted" style="margin:4px 0 10px">' +
        'Connect a GitHub token to keep the whole database safe in the cloud: it is encrypted, auto-saved after ' +
        'every change, and restored automatically when the server restarts.</p>' +
        '<div class="row" style="flex-wrap:wrap">' +
        '<input id="cloudTok" type="password" placeholder="GitHub personal access token" style="min-width:230px" autocomplete="off">' +
        '<input id="cloudPw" type="password" placeholder="Cloud passphrase (6+ chars)" style="min-width:190px" autocomplete="off">' +
        '<button class="btn primary" id="cloudConnect"></button></div>' +
        '<p class="hintline">The token needs Contents: Read and write permission on this repository.</p>';
      document.getElementById('cloudConnect').innerHTML = icon('globe', 15) + ' Connect';
      document.getElementById('cloudConnect').onclick = async function () {
        this.disabled = true;
        try {
          await POST('/api/admin/cloud/connect', {
            token: document.getElementById('cloudTok').value.trim(),
            passphrase: document.getElementById('cloudPw').value
          });
          toast('Cloud storage connected');
          loadCloud();
        } catch (err) { toast(err.message, 'bad'); this.disabled = false; }
      };
      return;
    }
    var state = st.saving ? 'Saving to cloud…'
      : st.lastError ? 'Error — ' + esc(st.lastError)
      : st.lastSavedAt ? 'Saved ' + fmtAgo(st.lastSavedAt)
      : 'Connected — not saved yet';
    var dotCls = st.lastError ? 'bad' : (st.lastSavedAt ? 'ok' : '');
    cloudBox.innerHTML =
      '<div class="cloudrow"><span class="dot ' + dotCls + '"></span><b style="font-size:15px">Cloud save</b>' +
      '<span class="small muted">' + state + '</span><span class="spacer"></span>' +
      '<button class="btn sm" id="cloudSaveNow"></button>' +
      '<button class="btn sm" id="cloudRestore"></button></div>' +
      '<p class="hintline">Auto-saves to the <b>' + esc(st.branch) + '</b> branch of your GitHub repo, AES-256 encrypted — ' +
      st.users + ' users, ' + st.quizzes + ' quizzes, ' + st.attempts + ' attempts. Restored automatically on server restart.</p>';
    document.getElementById('cloudSaveNow').innerHTML = icon('upload', 14) + ' Save to cloud now';
    document.getElementById('cloudRestore').innerHTML = icon('download', 14) + ' Restore from cloud';
    document.getElementById('cloudSaveNow').onclick = async function () {
      this.disabled = true;
      try { await POST('/api/admin/cloud/save', {}); toast('Saved to the cloud'); }
      catch (err) { toast(err.message, 'bad'); }
      this.disabled = false;
      loadCloud();
    };
    document.getElementById('cloudRestore').onclick = async function () {
      this.disabled = true;
      try {
        var r = await POST('/api/admin/cloud/restore', {});
        toast('Restored from cloud — ' + r.quizzes + ' quizzes, ' + r.users + ' users, ' + r.attempts + ' attempts');
        await refresh();
        loadClasses();
        loadCloud();
        this.disabled = false;
        return;
      } catch (err) { toast(err.message, 'bad'); }
      this.disabled = false;
    };
  }
  async function loadCloud() {
    try { paintCloud(await GET('/api/admin/cloud/status')); } catch (e) { /* offline */ }
  }
  loadCloud();
  setInterval(function () { if (!document.hidden) loadCloud(); }, 30000);

})().catch(function () {});
</script>
</body>
</html>
