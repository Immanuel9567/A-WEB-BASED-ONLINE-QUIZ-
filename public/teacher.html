<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher dashboard — ClassMark</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preload" href="fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231a73e8'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="app">
<div id="nav"></div>

<main class="container">
  <section class="pagehead">
    <div>
      <span class="eyebrow">Teacher workspace</span>
      <h1 id="welcome">Loading…</h1>
      <p class="sub" id="welcomeSub">Build quizzes, monitor sessions live and review analytics.</p>
    </div>
    <div class="headactions">
      <button class="btn" id="headCreateClass"></button>
      <a class="btn primary" href="builder.html?new=1" id="headCreateQuiz"></a>
    </div>
  </section>

  <section class="statgrid" id="stats"></section>

  <div class="dashboard-grid">
    <section class="card quiz-panel" style="padding:0;overflow:hidden">
      <div class="section-heading">
        <div>
          <span class="eyebrow" style="color:var(--faint)">Assessment library</span>
          <h2>My quizzes</h2>
        </div>
      </div>
      <div class="quiz-tools">
        <div class="qz-search"><span class="qs-ic" id="qsIco"></span><input id="qzSearch" type="text" placeholder="Search quizzes" autocomplete="off"></div>
        <select id="qzClassFilter" class="qz-select" title="Filter by class"></select>
        <button type="button" class="status-toggle" id="statusToggle"></button>
        <select id="qzSort" class="qz-select" title="Sort quizzes" style="width:150px">
          <option value="newest">Newest first</option>
          <option value="title">Title A–Z</option>
          <option value="questions">Most questions</option>
          <option value="duration">Longest duration</option>
          <option value="attempts">Most attempts</option>
        </select>
      </div>
      <div class="quiz-list" id="quizList">
        <div class="empty"><div class="eico" id="loadIco"></div><span class="skeleton">Loading…</span></div>
      </div>
    </section>

    <aside class="right-column">
      <section class="card classes-panel" style="padding:0;overflow:hidden">
        <div class="section-heading">
          <div>
            <span class="eyebrow" style="color:var(--faint)">Quick access</span>
            <h2>My classes</h2>
          </div>
          <button class="iconbtn subtle" id="clsNew" title="Create a class" aria-label="Create a class"></button>
        </div>
        <div id="clsNewRow" hidden style="padding:0 16px 14px">
          <div class="field" style="margin:0">
            <label for="clsName">New class name</label>
            <div class="row" style="flex-wrap:nowrap">
              <input id="clsName" type="text" placeholder="Class name" autocomplete="off" style="flex:1;min-width:0">
              <button class="btn primary" id="clsGo"></button>
              <button class="btn" id="clsCancelNew">Cancel</button>
            </div>
          </div>
        </div>
        <div class="class-list" id="classList"></div>
        <div style="padding:14px">
          <a class="secondary-button" href="classes.html" id="manageAll"></a>
        </div>
      </section>
    </aside>
  </div>
</main>

<script src="js/app.js"></script>
<script>
(async function () {
  var user = await requireLogin('teacher');
  navbar(user, 'dashboard');
  var h = new Date().getHours();
  document.getElementById('welcome').textContent =
    (h < 12 ? 'Good morning, ' : h < 17 ? 'Good afternoon, ' : 'Good evening, ') + user.name.split(' ')[0];
  document.getElementById('headCreateClass').innerHTML = icon('plus', 15) + ' Create class';
  document.getElementById('headCreateQuiz').innerHTML = icon('plus', 15) + ' Create quiz';
  document.getElementById('qsIco').innerHTML = icon('search', 15);
  document.getElementById('loadIco').innerHTML = icon('fileText', 34);
  document.getElementById('clsNew').innerHTML = icon('plus', 17);
  document.getElementById('clsGo').innerHTML = icon('plus', 15) + ' Create class';
  document.getElementById('manageAll').innerHTML = 'Manage all classes ' + icon('chevronRight', 15);

  var quizzes = [], students = [], classes = [];

  /* ---- everything re-renders in place after every change — no page refresh ---- */
  async function refresh() {
    var results = await Promise.all([GET('/api/quizzes'), GET('/api/students'), GET('/api/classes/mine')]);
    quizzes = results[0].quizzes;
    students = results[1].students;   // only students enrolled in my classes
    classes = results[2].classes || [];
    renderStats();
    renderRows();
    renderClasses();
    paintClassFilter();
  }

  function renderStats() {
    var totalAttempts = quizzes.reduce(function (s, q) { return s + q.attemptCount; }, 0);
    var withAvg = quizzes.filter(function (q) { return q.avgPercent != null; });
    var overallAvg = withAvg.length
      ? Math.round(withAvg.reduce(function (s, q) { return s + q.avgPercent; }, 0) / withAvg.length * 10) / 10
      : null;
    var t = Date.now();
    var active = quizzes.filter(function (q) {
      return q.published && !(q.opensAt && q.opensAt > t) && !(q.closesAt && q.closesAt <= t);
    }).length;
    document.getElementById('stats').innerHTML =
      statCard('users', students.length, 'My students', 'across ' + classes.length + ' class' + (classes.length === 1 ? '' : 'es'), '', 'students.html') +
      statCard('fileText', quizzes.length, 'Quizzes created', active + ' active now', 'mint') +
      statCard('clipboardCheck', totalAttempts, 'Attempts graded', withAvg.length + ' quizzes scored', 'amber') +
      statCard('award', fmtPct(overallAvg), 'Average score', 'across all attempts', 'accent');
  }

  /* ---- toolbar state: search, class filter, status popup, sort ---- */
  var qzSearch = '', qzCls = '', qzStatus = '', qzSortKey = 'newest';
  function statusOf(q) { // one status per quiz — matches the badge shown in the row
    var t = Date.now();
    if (!q.published) return 'draft';
    if (q.opensAt && t < q.opensAt) return 'scheduled';
    if (q.closesAt && t >= q.closesAt) return 'expired';
    return 'ongoing';
  }
  var STATUS_META = {
    ongoing: { label: 'Ongoing', badge: 'ok' },
    scheduled: { label: 'Scheduled', badge: 'info' },
    expired: { label: 'Expired', badge: 'warn' },
    draft: { label: 'Draft', badge: 'plain' }
  };
  document.getElementById('qzSearch').oninput = function () {
    qzSearch = this.value.trim().toLowerCase();
    renderRows();
  };
  var selQzCls = document.getElementById('qzClassFilter');
  var selQzSort = document.getElementById('qzSort');
  selQzCls.onchange = function () { qzCls = this.value; renderRows(); };
  selQzSort.onchange = function () { qzSortKey = this.value; renderRows(); };
  function paintClassFilter() {
    selQzCls.innerHTML = '<option value="">All classes</option>' + classes.map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
    }).join('');
    if (classes.some(function (c) { return c.id === qzCls; })) selQzCls.value = qzCls;
    else qzCls = '';
  }

  /* status filter — themed popup under the toggle (fixed, so it can never clip) */
  var statusToggle = document.getElementById('statusToggle');
  var statusMenu = document.createElement('div');
  statusMenu.className = 'dd-menu qz-status-menu';
  statusMenu.setAttribute('role', 'listbox');
  statusMenu.hidden = true;
  document.body.appendChild(statusMenu);
  var STATUSES = [
    { v: '', l: 'All statuses' },
    { v: 'ongoing', l: 'Ongoing' },
    { v: 'scheduled', l: 'Scheduled' },
    { v: 'expired', l: 'Expired' },
    { v: 'draft', l: 'Draft' }
  ];
  function paintStatusToggle() {
    var cur = STATUSES.find(function (s) { return s.v === qzStatus; }) || STATUSES[0];
    statusToggle.innerHTML = icon('sliders', 15) + esc(cur.l) + icon('chevronDown', 14);
    statusToggle.classList.toggle('on', !!qzStatus || !statusMenu.hidden);
  }
  function closeStatusMenu() { statusMenu.hidden = true; paintStatusToggle(); }
  statusToggle.onclick = function () {
    if (statusMenu.hidden) {
      statusMenu.innerHTML = STATUSES.map(function (s) {
        return '<button type="button" class="dd-item' + (qzStatus === s.v ? ' on' : '') + '" data-st="' + s.v + '" role="option">' +
          '<span class="dd-txt">' + s.l + '</span>' + (qzStatus === s.v ? icon('check', 15) : '') + '</button>';
      }).join('');
      var r = statusToggle.getBoundingClientRect();
      statusMenu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 200)) + 'px';
      statusMenu.style.top = (r.bottom + 6) + 'px';
      statusMenu.hidden = false;
      paintStatusToggle();
    } else closeStatusMenu();
  };
  statusMenu.addEventListener('click', function (e) {
    var b = e.target.closest('.dd-item');
    if (!b) return;
    qzStatus = b.getAttribute('data-st');
    closeStatusMenu();
    renderRows();
  });
  document.addEventListener('click', function (e) {
    if (!statusMenu.hidden && !statusToggle.contains(e.target) && !statusMenu.contains(e.target)) closeStatusMenu();
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !statusMenu.hidden) closeStatusMenu(); });
  document.addEventListener('scroll', function () { if (!statusMenu.hidden) closeStatusMenu(); }, true);
  paintStatusToggle();

  /* ---- the quiz list ---- */
  var list = document.getElementById('quizList');
  var SORTS = {
    newest: function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0) || a.title.localeCompare(b.title); },
    title: function (a, b) { return a.title.localeCompare(b.title); },
    questions: function (a, b) { return b.questionCount - a.questionCount || a.title.localeCompare(b.title); },
    duration: function (a, b) { return b.durationMin - a.durationMin || a.title.localeCompare(b.title); },
    attempts: function (a, b) { return b.attemptCount - a.attemptCount || a.title.localeCompare(b.title); }
  };
  function renderRows() {
    if (!quizzes.length) {
      list.innerHTML = '<div class="empty"><div class="eico">' + icon('fileText', 34) + '</div>' +
        'No quizzes yet — create your first quiz.</div>';
      return;
    }
    var rows = quizzes.filter(function (q) {
      if (qzCls && !(q.classInfo || []).some(function (c) { return c.id === qzCls; })) return false;
      if (qzStatus && statusOf(q) !== qzStatus) return false;
      if (qzSearch) {
        var hay = (q.title + ' ' + q.subject + ' ' + (q.classInfo || []).map(function (c) { return c.name; }).join(' ')).toLowerCase();
        if (hay.indexOf(qzSearch) < 0) return false;
      }
      return true;
    });
    rows.sort(SORTS[qzSortKey] || SORTS.newest);
    if (!rows.length) {
      list.innerHTML = '<div class="empty"><div class="eico">' + icon('search', 30) + '</div>' +
        'No quizzes match these filters.</div>';
      return;
    }
    list.innerHTML = rows.map(row).join('');
    wireRows();
  }
  function row(q) {
    var st = STATUS_META[statusOf(q)];
    var cls = q.classInfo || [];
    var color = cls.length && cls[0].color ? cls[0].color : '';
    var sub = esc(q.subject) + (cls.length
      ? ' · ' + cls.map(function (c) { return esc(c.name); }).join(', ')
      : ' · no class yet — students cannot see it');
    if (q.draftCount > 0) sub += ' · ' + q.draftCount + ' draft' + (q.draftCount > 1 ? 's' : '');
    var avg = q.avgPercent != null
      ? '<strong>' + fmtPct(q.avgPercent) + '</strong>'
      : '<span class="small muted">—</span>';
    if (q.published && !q.startedAt && q.waitingCount) {
      avg += '<span class="chip">' + icon('clock', 12) + ' ' + q.waitingCount + ' waiting</span>';
    }
    return '<div class="quiz-row" data-qz="' + esc(q.id) + '">' +
      '<span class="quiz-symbol"' + (color ? ' style="background:' + esc(color) + '"' : '') + '>' + icon('fileText', 16) + '</span>' +
      '<div class="quiz-title"><strong>' + esc(q.title) + '</strong><span class="tsub">' + sub + '</span></div>' +
      '<div class="quiz-data"><span>Questions</span><strong>' + q.questionCount + '</strong></div>' +
      '<div class="quiz-data"><span>Duration</span><strong>' + q.durationMin + ' min</strong></div>' +
      '<div class="quiz-data"><span>Attempts</span><strong>' + q.attemptCount + '</strong></div>' +
      '<div class="quiz-score"><span>Average</span>' + avg + '</div>' +
      '<span class="badge ' + st.badge + '">' + st.label + '</span>' +
      '<button type="button" class="iconbtn subtle morebtn" data-more="' + esc(q.id) + '" aria-label="Quiz options">' + icon('moreH', 17) + '</button>' +
      '</div>';
  }

  /* per-row options menu — fixed to the body so it never clips */
  var moreMenu = document.createElement('div');
  moreMenu.className = 'dd-menu qz-status-menu';
  moreMenu.hidden = true;
  document.body.appendChild(moreMenu);
  var moreFor = null;
  function closeMoreMenu() { moreMenu.hidden = true; moreFor = null; }
  document.addEventListener('click', function (e) {
    if (!moreMenu.hidden && !moreMenu.contains(e.target) && !(e.target.closest && e.target.closest('[data-more]'))) closeMoreMenu();
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !moreMenu.hidden) closeMoreMenu(); });
  document.addEventListener('scroll', function () { if (!moreMenu.hidden) closeMoreMenu(); }, true);
  function wireRows() {
    $$('[data-more]', list).forEach(function (b) {
      b.onclick = function () {
        var q = quizzes.find(function (x) { return x.id === b.getAttribute('data-more'); });
        if (!q) return;
        moreFor = q;
        moreMenu.innerHTML =
          '<a class="dd-item" href="builder.html?id=' + esc(q.id) + '"><span class="dd-txt">' + icon('edit', 15) + ' Questions</span></a>' +
          '<a class="dd-item" href="insights.html?id=' + esc(q.id) + '"><span class="dd-txt">' + icon('barChart', 15) + ' View and manage</span></a>' +
          '<button type="button" class="dd-item" data-pub="' + esc(q.id) + '"><span class="dd-txt">' +
            (q.published ? icon('globe', 15) + ' Unpublish' : icon('send', 15) + ' Publish') + '</span></button>' +
          '<button type="button" class="dd-item danger" data-del="' + esc(q.id) + '"><span class="dd-txt">' + icon('trash', 15) + ' Delete quiz</span></button>';
        var r = b.getBoundingClientRect();
        moreMenu.style.left = Math.max(8, Math.min(r.left - 130, window.innerWidth - 210)) + 'px';
        moreMenu.style.top = (r.bottom + 6) + 'px';
        moreMenu.hidden = false;
      };
    });
  }
  moreMenu.addEventListener('click', async function (e) {
    var pub = e.target.closest('[data-pub]');
    var del = e.target.closest('[data-del]');
    if (pub) {
      var q = quizzes.find(function (x) { return x.id === pub.getAttribute('data-pub'); });
      closeMoreMenu();
      try {
        var r = await PUT('/api/quizzes/' + q.id, { published: !q.published });
        q.published = r.quiz.published;
        toast(q.published ? 'Quiz published — students were notified' : 'Quiz unpublished — hidden from students');
        refresh();
      } catch (err) { toast(err.message, 'bad'); }
    } else if (del) {
      var qz = quizzes.find(function (x) { return x.id === del.getAttribute('data-del'); });
      closeMoreMenu();
      var ok = await confirmModal({
        title: 'Delete "' + qz.title + '"?',
        body: 'This permanently removes the quiz, its questions and <b>' + qz.attemptCount + '</b> attempt records.',
        okText: 'Delete permanently', danger: true
      });
      if (!ok) return;
      try {
        await DEL('/api/quizzes/' + qz.id);
        toast('Quiz deleted');
        quizzes = quizzes.filter(function (x) { return x.id !== qz.id; });
        refresh();
      } catch (err) { toast(err.message, 'bad'); }
    }
  });

  /* ---- classes rail: accent rows + tap-to-copy codes + inline create ---- */
  function renderClasses() {
    var box = document.getElementById('classList');
    if (!classes.length) {
      box.innerHTML = '<div class="empty" style="padding:26px 16px"><div class="eico">' + icon('bookOpen', 30) + '</div>' +
        'No classes yet — create one and share its code.</div>';
      return;
    }
    box.innerHTML = classes.map(function (c) {
      return '<div class="class-row">' +
        '<span class="class-accent"' + (c.color ? ' style="background:' + esc(c.color) + '"' : '') + '></span>' +
        '<div><strong>' + esc(c.name) + '</strong>' +
        '<span class="csub">' + c.memberCount + ' student' + (c.memberCount === 1 ? '' : 's') + ' · ' +
        c.courseCount + ' course' + (c.courseCount === 1 ? '' : 's') + '</span></div>' +
        '<button type="button" class="code-button" data-copy="' + esc(c.code) + '" data-open="' + esc(c.id) + '" title="Tap to copy the join code">' +
        esc(c.code) + icon('copy', 13) + '</button>' +
        '</div>';
    }).join('');
    $$('[data-copy]', box).forEach(function (b) {
      b.onclick = function () { copyText(b.getAttribute('data-copy'), 'Class code copied'); };
    });
  }
  var newRow = document.getElementById('clsNewRow');
  document.getElementById('clsNew').onclick = function () {
    newRow.hidden = !newRow.hidden;
    if (!newRow.hidden) document.getElementById('clsName').focus();
  };
  document.getElementById('headCreateClass').onclick = function () {
    newRow.hidden = false;
    document.getElementById('clsName').focus();
    newRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  document.getElementById('clsCancelNew').onclick = function () { newRow.hidden = true; };
  document.getElementById('clsGo').onclick = async function () {
    this.disabled = true;
    try {
      var r = await POST('/api/classes', { name: document.getElementById('clsName').value });
      toast('Class created — share code ' + r.class.code + ' with your students');
      newRow.hidden = true;
      document.getElementById('clsName').value = '';
      refresh();
    } catch (err) { toast(err.message, 'bad'); this.disabled = false; }
  };

  try { await refresh(); }
  catch (e) {
    document.getElementById('quizList').innerHTML =
      '<div class="empty">Could not load your quizzes — ' + esc(e.message) + '</div>';
  }
})().catch(function () {});
</script>
</body>
</html>
