<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher dashboard — OQAS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f46e5'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="nav"></div>

<main class="container">
  <section class="pagehead">
    <div>
      <h1>Teacher dashboard</h1>
      <p class="sub" id="welcome">Loading…</p>
    </div>
    <button class="btn primary" id="newQuizBtn">＋ Create quiz</button>
  </section>

  <section class="statgrid" id="stats"></section>

  <h2 class="sec">My quizzes</h2>
  <section class="card tablecard">
    <table>
      <thead><tr>
        <th>Quiz</th><th>Status</th><th>Questions</th><th>Duration</th><th>Pass</th>
        <th>Attempts</th><th>Average</th><th style="text-align:right">Actions</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
    </table>
  </section>
  <p style="margin:26px 2px 50px"></p>
</main>

<!-- ============ create quiz modal ============ -->
<div class="overlay" id="createOverlay" hidden>
  <div class="modal">
    <h3>Create a new quiz</h3>
    <p class="muted small">You can add questions on the next screen, then publish when ready.</p>
    <div class="form-err" id="createErr" hidden></div>
    <form id="createForm" novalidate>
      <div class="field">
        <label for="cqTitle">Quiz title</label>
        <input id="cqTitle" type="text" placeholder="e.g. Data Structures — Mid-Semester Test">
      </div>
      <div class="field">
        <label for="cqSubject">Subject / course code</label>
        <input id="cqSubject" type="text" placeholder="e.g. Computer Science (CSC 204)">
      </div>
      <div class="field">
        <label for="cqDesc">Description</label>
        <textarea id="cqDesc" placeholder="What this assessment covers…"></textarea>
      </div>
      <div class="formrow">
        <div class="field">
          <label for="cqDur">Duration (minutes)</label>
          <input id="cqDur" type="number" value="15" min="1" max="180">
        </div>
        <div class="field">
          <label for="cqPass">Pass mark (%)</label>
          <input id="cqPass" type="number" value="50" min="0" max="100">
        </div>
      </div>
      <div class="formrow">
        <div class="field">
          <label for="cqAtt">Attempts allowed</label>
          <input id="cqAtt" type="number" value="2" min="1" max="10">
        </div>
        <div class="field">
          <label>Anti-cheat</label>
          <label class="row small" style="gap:7px;padding:10px 0">
            <input type="checkbox" id="cqShuffle" checked style="width:auto"> Shuffle questions per student
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="createCancel">Cancel</button>
        <button type="submit" class="btn primary" id="createGo">Create quiz</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script>
(async function () {
  var user = await requireLogin('teacher');
  navbar(user, 'dashboard');
  document.getElementById('welcome').textContent =
    'Welcome, ' + user.name + ' — build quizzes, monitor sessions live and review analytics.';

  var results = await Promise.all([GET('/api/quizzes'), GET('/api/users')]);
  var quizzes = results[0].quizzes;
  var users = results[1].users;
  var students = users.filter(function (u) { return u.role === 'student'; });

  /* ---- stats ---- */
  var totalAttempts = quizzes.reduce(function (s, q) { return s + q.attemptCount; }, 0);
  var finished = quizzes.reduce(function (s, q) { return s + q.finishedCount; }, 0);
  var withAvg = quizzes.filter(function (q) { return q.avgPercent != null; });
  var overallAvg = withAvg.length
    ? Math.round(withAvg.reduce(function (s, q) { return s + q.avgPercent; }, 0) / withAvg.length * 10) / 10
    : null;
  document.getElementById('stats').innerHTML =
    st(quizzes.length, 'Quizzes created') +
    st(students.length, 'Enrolled students') +
    st(totalAttempts, 'Attempts (incl. live)') +
    st(fmtPct(overallAvg), 'Average score', true);
  function st(v, l, acc) {
    return '<div class="stat' + (acc ? ' accent' : '') + '"><div class="num">' + v + '</div><div class="lbl">' + l + '</div></div>';
  }

  /* ---- table ---- */
  var tb = document.getElementById('rows');
  if (!quizzes.length) {
    tb.innerHTML = '<tr><td colspan="8"><div class="empty"><div class="big">📝</div>No quizzes yet — create your first one above.</div></td></tr>';
  } else {
    tb.innerHTML = quizzes.map(row).join('');
    wire();
  }

  function row(q) {
    return '<tr>' +
      '<td><b>' + esc(q.title) + '</b><br><span class="small muted">' + esc(q.subject) + '</span></td>' +
      '<td>' + (q.published ? '<span class="badge ok">Published</span>' : '<span class="badge muted">Draft</span>') + '</td>' +
      '<td>' + q.questionCount + ' <span class="small muted">(' + q.totalPoints + ' pts)</span></td>' +
      '<td>⏱ ' + q.durationMin + ' min</td>' +
      '<td>' + q.passMark + '%</td>' +
      '<td>' + q.attemptCount + '</td>' +
      '<td>' + (q.avgPercent != null ? '<b>' + fmtPct(q.avgPercent) + '</b>' : '—') + '</td>' +
      '<td class="actions" style="text-align:right;white-space:nowrap">' +
      '<a class="btn sm" href="builder.html?id=' + q.id + '">✏️ Questions</a>' +
      '<a class="btn sm primary" href="insights.html?id=' + q.id + '">📈 Insights</a>' +
      '<button class="btn sm" data-pub="' + q.id + '">' + (q.published ? 'Unpublish' : 'Publish') + '</button>' +
      '<button class="btn sm danger" data-del="' + q.id + '">Delete</button>' +
      '</td></tr>';
  }

  function wire() {
    $$('[data-pub]').forEach(function (b) {
      b.onclick = async function () {
        b.disabled = true;
        var q = quizzes.find(function (x) { return x.id === b.getAttribute('data-pub'); });
        try {
          await PUT('/api/quizzes/' + q.id, { published: !q.published });
          toast(q.published ? 'Quiz unpublished — hidden from students' : 'Quiz published — students can now take it');
          setTimeout(function () { location.reload(); }, 600);
        } catch (err) { toast(err.message, 'bad'); b.disabled = false; }
      };
    });
    $$('[data-del]').forEach(function (b) {
      b.onclick = async function () {
        var q = quizzes.find(function (x) { return x.id === b.getAttribute('data-del'); });
        var ok = await confirmModal({
          title: 'Delete “' + q.title + '”?',
          body: 'This permanently removes the quiz, its questions and <b>all ' + q.attemptCount + '</b> attempt records.',
          okText: 'Delete permanently', danger: true
        });
        if (!ok) return;
        try { await DEL('/api/quizzes/' + q.id); toast('Quiz deleted'); setTimeout(function () { location.reload(); }, 500); }
        catch (err) { toast(err.message, 'bad'); }
      };
    });
  }

  /* ---- create modal ---- */
  var ov = document.getElementById('createOverlay');
  document.getElementById('newQuizBtn').onclick = function () { ov.hidden = false; };
  document.getElementById('createCancel').onclick = function () { ov.hidden = true; };
  ov.onclick = function (e) { if (e.target === ov) ov.hidden = true; };

  document.getElementById('createForm').onsubmit = async function (e) {
    e.preventDefault();
    var errBox = document.getElementById('createErr');
    errBox.hidden = true;
    var btn = document.getElementById('createGo');
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      var r = await POST('/api/quizzes', {
        title: document.getElementById('cqTitle').value,
        subject: document.getElementById('cqSubject').value,
        description: document.getElementById('cqDesc').value,
        durationMin: Number(document.getElementById('cqDur').value),
        passMark: Number(document.getElementById('cqPass').value),
        attemptsAllowed: Number(document.getElementById('cqAtt').value),
        shuffle: document.getElementById('cqShuffle').checked
      });
      toast('Quiz created — now add questions');
      location.href = 'builder.html?id=' + r.quiz.id;
    } catch (err) {
      errBox.textContent = err.message; errBox.hidden = false;
      btn.disabled = false; btn.textContent = 'Create quiz';
    }
  };
})().catch(function () {});
</script>
</body>
</html>
