<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enrolled students — ClassMark</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231a73e8'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="app">
<div id="nav"></div>

<main class="container">
  <!-- ============ LIST VIEW ============ -->
  <section id="listView">
    <section class="pagehead">
      <div>
        <h1>Enrolled students</h1>
        <p class="sub" id="sub">Loading…</p>
      </div>
      <button class="btn" id="csvBtn"></button>
    </section>

    <section class="statgrid" id="stats"></section>

    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:12px">
      <h2 class="sec" id="listHead" style="margin:22px 0 10px">All students</h2>
      <select id="classFilter" title="Show one class or all classes"></select>
    </div>
    <section class="card tablecard">
      <table>
        <thead><tr>
          <th data-k="name">Student <span class="sarr"></span></th><th data-k="joined">Joined <span class="sarr"></span></th>
          <th data-k="quizzes">Quizzes <span class="sarr"></span></th><th data-k="attempts">Attempts <span class="sarr"></span></th>
          <th data-k="avg">Average <span class="sarr"></span></th><th data-k="best">Best <span class="sarr"></span></th>
          <th data-k="active">Last active <span class="sarr"></span></th><th></th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
      </table>
    </section>
  </section>

  <!-- ============ DETAIL VIEW ============ -->
  <section id="detailView" hidden>
    <section class="pagehead">
      <div>
        <h1 id="dName">Student</h1>
        <p class="sub" id="dSub"></p>
      </div>
      <button class="btn" id="backBtn"></button>
    </section>

    <section class="statgrid" id="dStats"></section>

    <h2 class="sec">Quiz history</h2>
    <section class="card tablecard">
      <table>
        <thead><tr>
          <th>Quiz</th><th>Score</th><th>Percent</th><th>Outcome</th><th>Status</th>
          <th>Time used</th><th>Tab switches</th><th>Submitted</th><th></th>
        </tr></thead>
        <tbody id="dRows"><tr><td colspan="9" class="muted">Loading…</td></tr></tbody>
      </table>
    </section>
  </section>

  <p style="margin:30px 2px 50px"></p>
</main>

<script src="js/app.js"></script>
<script>
(async function () {
  var user = await requireLogin('teacher');
  navbar(user, 'students');
  document.getElementById('csvBtn').innerHTML = icon('download', 14) + ' Export CSV';
  document.getElementById('backBtn').innerHTML = icon('arrowLeft', 15) + ' Back to students';

  var students = [];
  var listView = document.getElementById('listView');
  var detailView = document.getElementById('detailView');

  function initialsOf(name) {
    return name.trim().split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
  }

  /* ============ list view: class filter + sortable columns (teacher analytics) ============ */
  var classes = [];
  var filterClass = '';    // '' = all classes
  var sortKey = 'active';  // default: most recent activity first
  var sortDir = -1;

  var KEYS = {
    name: function (s) { return s.name.toLowerCase(); },
    joined: function (s) { return s.createdAt; },
    quizzes: function (s) { return s.quizzesTaken; },
    attempts: function (s) { return s.attempts; },
    avg: function (s) { return s.avgPercent; },
    best: function (s) { return s.bestPercent; },
    active: function (s) { return s.lastActivity; }
  };

  function view() { // filter by class, then sort — students without attempts always last
    var list = students.filter(function (s) {
      return !filterClass || (s.classes || []).some(function (c) { return c.id === filterClass; });
    });
    var get = KEYS[sortKey] || KEYS.active;
    var isName = sortKey === 'name';
    list.sort(function (a, b) {
      var va = get(a), vb = get(b);
      if (va == null && vb == null) return a.name.localeCompare(b.name);
      if (va == null) return 1;
      if (vb == null) return -1;
      var r = isName ? va.localeCompare(vb) : va - vb;
      return (r || a.name.localeCompare(b.name)) * (isName ? sortDir : sortDir) || a.name.localeCompare(b.name);
    });
    return list;
  }

  function paintArrows(root) {
    $$(root + ' th[data-k]').forEach(function (th) {
      var on = th.getAttribute('data-k') === sortKey;
      th.querySelector('.sarr').innerHTML = on ? icon(sortDir > 0 ? 'arrowUp' : 'arrowDown', 12) : '';
    });
  }

  function wireSort(root) {
    $$(root + ' th[data-k]').forEach(function (th) {
      th.onclick = function () {
        var k = th.getAttribute('data-k');
        if (sortKey === k) sortDir = -sortDir;
        else { sortKey = k; sortDir = k === 'name' ? 1 : -1; }
        renderList();
      };
    });
  }

  function renderList() {
    paintArrows('#listView');
    var list = view();
    var cls = classes.find(function (c) { return c.id === filterClass; });

    document.getElementById('listHead').textContent = cls
      ? cls.name + ' — ' + list.length + ' student' + (list.length === 1 ? '' : 's')
      : 'All students';

    var withAttempts = list.filter(function (s) { return s.attempts > 0; }).length;
    var writing = list.filter(function (s) { return s.inProgress; }).length;
    var avgs = list.filter(function (s) { return s.avgPercent != null; }).map(function (s) { return s.avgPercent; });
    var avg = avgs.length ? Math.round(avgs.reduce(function (a, b) { return a + b; }, 0) / avgs.length * 10) / 10 : null;
    document.getElementById('stats').innerHTML =
      stat(list.length, cls ? 'In ' + cls.name : 'Students shown') +
      stat(withAttempts, 'Taken at least one quiz') +
      stat(writing, 'Writing right now', writing > 0) +
      stat(fmtPct(avg), cls ? cls.name + ' average' : 'Average score', true);

    var tb = document.getElementById('rows');
    if (!students.length) {
      tb.innerHTML = '<tr><td colspan="8"><div class="empty"><div class="eico">' + icon('users', 34) + '</div>' +
        'No students enrolled yet — students can register from the sign-in page.</div></td></tr>';
      return;
    }
    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="8"><div class="empty"><div class="eico">' + icon('users', 34) + '</div>' +
        'No students in ' + esc(cls ? cls.name : 'this class') + ' yet — share its join code.</div></td></tr>';
      return;
    }
    tb.innerHTML = list.map(function (s) {
      var chips = (s.classes || []).map(function (c) {
        return '<span class="chip classchip">' + (c.color ? '<span class="classdot" style="background:' + esc(c.color) + '"></span>' : '') + esc(c.name) + '</span>';
      }).join(' ');
      return '<tr>' +
        '<td><div class="stucell"><span class="avatar">' + esc(initialsOf(s.name)) + '</span>' +
        '<span><span class="sname">' + esc(s.name) + '</span><br><span class="smail">' + esc(s.email) + '</span>' +
        (chips ? '<br><span class="small" style="display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:4px">' + chips + '</span>' : '') +
        '</span></div></td>' +
        '<td class="small muted">' + new Date(s.createdAt).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) + '</td>' +
        '<td>' + s.quizzesTaken + '</td>' +
        '<td>' + s.attempts + '</td>' +
        '<td><b>' + fmtPct(s.avgPercent) + '</b></td>' +
        '<td>' + fmtPct(s.bestPercent) + '</td>' +
        '<td class="small muted">' + (s.inProgress ? '<span class="badge info">Writing now</span>' : fmtAgo(s.lastActivity)) + '</td>' +
        '<td class="actions"><button class="btn sm" data-hist="' + s.id + '">' + icon('fileText', 13) + ' History</button></td>' +
        '</tr>';
    }).join('');

    $$('[data-hist]').forEach(function (b) {
      b.onclick = function () { openHistory(b.getAttribute('data-hist')); };
    });
  }

  async function loadList() {
    var r = await Promise.all([GET('/api/students'), GET('/api/classes/mine')]);
    students = r[0].students;
    classes = r[1].classes || [];

    document.getElementById('sub').textContent =
      students.length + ' student' + (students.length === 1 ? '' : 's') + ' registered on the system';

    var sel = document.getElementById('classFilter');
    sel.innerHTML = '<option value="">All classes</option>' + classes.map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
    }).join('');
    sel.onchange = function () { filterClass = sel.value; renderList(); };

    wireSort('#listView');
    renderList();
  }

  function stat(v, l, accent) {
    return '<div class="stat' + (accent ? ' accent' : '') + '"><div class="num">' + v + '</div><div class="lbl">' + l + '</div></div>';
  }

  /* ================= detail view ================= */
  async function openHistory(id) {
    var stu = students.find(function (s) { return s.id === id; });
    document.getElementById('dName').textContent = stu ? stu.name : 'Student';
    try {
      var r = await GET('/api/students/' + id + '/history');
      var s = r.student;
      document.getElementById('dName').textContent = s.name;
      document.getElementById('dSub').textContent = s.email + ' · enrolled ' +
        new Date(s.createdAt).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });

      var done = r.attempts.filter(function (a) { return a.status !== 'in_progress'; });
      var best = done.length ? Math.max.apply(null, done.map(function (a) { return a.percent; })) : null;
      var avg = done.length ? Math.round(done.reduce(function (t, a) { return t + a.percent; }, 0) / done.length * 10) / 10 : null;
      document.getElementById('dStats').innerHTML =
        stat(r.attempts.length, 'Total attempts') +
        stat(done.length, 'Graded attempts') +
        stat(fmtPct(avg), 'Average score') +
        stat(fmtPct(best), 'Best score', true);

      var tb = document.getElementById('dRows');
      if (!r.attempts.length) {
        tb.innerHTML = '<tr><td colspan="9"><div class="empty"><div class="eico">' + icon('fileText', 34) + '</div>' +
          'This student has not attempted any quizzes yet.</div></td></tr>';
      } else {
        tb.innerHTML = r.attempts.map(function (a) {
          var statusBadge = a.status === 'in_progress' ? '<span class="badge info">In progress</span>'
            : a.status === 'expired' ? '<span class="badge warn">Expired</span>'
            : '<span class="badge ok">Submitted</span>';
          return '<tr>' +
            '<td><b>' + esc(a.quizTitle) + '</b></td>' +
            '<td class="mono">' + (a.status === 'in_progress' ? '—' : a.score + '/' + a.maxScore) + '</td>' +
            '<td><b>' + (a.status === 'in_progress' ? '—' : fmtPct(a.percent)) + '</b></td>' +
            '<td>' + (a.status === 'in_progress' ? '—' : '<span class="badge ' + (a.passed ? 'ok' : 'bad') + '">' + (a.passed ? 'Pass' : 'Fail') + '</span>') + '</td>' +
            '<td>' + statusBadge + '</td>' +
            '<td>' + fmtDur(a.durationUsedSec) + '</td>' +
            '<td>' + (a.tabSwitches ? '<span class="badge warn">' + a.tabSwitches + '</span>' : '—') + '</td>' +
            '<td class="small muted">' + fmtWhen(a.submittedAt || a.startedAt) + '</td>' +
            '<td>' + (a.status === 'in_progress' ? '' : '<a class="btn sm" href="result.html?attempt=' + a.id + '">Review</a>') + '</td>' +
            '</tr>';
        }).join('');
      }
      listView.hidden = true;
      detailView.hidden = false;
      window.scrollTo({ top: 0 });
    } catch (err) {
      toast(err.message, 'bad');
    }
  }

  document.getElementById('backBtn').onclick = function () {
    detailView.hidden = true;
    listView.hidden = false;
    window.scrollTo({ top: 0 });
  };

  /* ================= CSV export ================= */
  document.getElementById('csvBtn').onclick = function () {
    if (!students.length) { toast('Nothing to export yet', 'bad'); return; }
    var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var head = ['Name', 'Email', 'Classes', 'Joined', 'Quizzes taken', 'Attempts', 'Average %', 'Best %', 'Last active'].map(q).join(',');
    var lines = view().map(function (s) {
      return [s.name, s.email, (s.classes || []).map(function (c) { return c.name; }).join('; '),
        new Date(s.createdAt).toISOString(), s.quizzesTaken, s.attempts,
        s.avgPercent, s.bestPercent, s.lastActivity ? new Date(s.lastActivity).toISOString() : ''].map(q).join(',');
    });
    var csv = head + '\n' + lines.join('\n');
    var a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = 'classmark-students.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast('CSV exported');
  };

  await loadList();

  /* deep link: students.html?id=<userId> opens that student's history directly */
  var deepId = new URLSearchParams(location.search).get('id');
  if (deepId) openHistory(deepId);
})().catch(function () {});
</script>
</body>
</html>
