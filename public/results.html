<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My results — ClassMark</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preload" href="fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231a73e8'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="app">
<div id="nav"></div>

<main class="container">
  <section class="pagehead">
    <div>
      <h1>My results</h1>
      <p class="sub" id="welcome">Loading…</p>
    </div>
    <span class="spacer"></span>
    <a class="btn" href="dashboard.html" id="backBtn"></a>
  </section>

  <section class="statgrid" id="stats"></section>

  <h2 class="sec">Attempt history</h2>
  <section class="card tablecard">
    <table>
      <thead><tr>
        <th>Quiz</th><th>Score</th><th>Percent</th><th>Outcome</th><th>Time used</th><th>Submitted</th><th></th>
      </tr></thead>
      <tbody id="resultsBody"><tr><td colspan="7" class="muted skeleton">Loading…</td></tr></tbody>
    </table>
  </section>

  <p class="small muted" style="margin:12px 2px 50px">
    Click View to review your answers for any attempt. Results appear here the moment you submit.
  </p>
</main>

<script src="js/app.js"></script>
<script>
(async function () {
  var user = await requireLogin('student');
  navbar(user, 'results');
  document.getElementById('welcome').textContent =
    'Every quiz you have submitted, ' + user.name.split(' ')[0] + ' — newest first.';
  document.getElementById('backBtn').innerHTML = icon('chevronLeft', 15) + ' Dashboard';

  var data = await GET('/api/me/attempts');
  var mine = data.attempts.filter(function (a) { return a.status !== 'in_progress' && a.status !== 'waiting'; });

  /* ---- summary cards ---- */
  function stat(num, lbl, accent) {
    return '<div class="stat' + (accent ? ' accent' : '') + '"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
  }
  var avg = mine.length ? Math.round(mine.reduce(function (s, a) { return s + a.percent; }, 0) / mine.length * 10) / 10 : null;
  var best = mine.length ? Math.max.apply(null, mine.map(function (a) { return a.percent; })) : null;
  var passes = mine.filter(function (a) { return a.passed; }).length;
  document.getElementById('stats').innerHTML =
    stat(mine.length, 'Attempts submitted') +
    stat(fmtPct(avg), 'My average score', true) +
    stat(fmtPct(best), 'My best score') +
    stat(passes + '/' + mine.length, 'Passed');

  /* ---- history table ---- */
  var rEl = document.getElementById('resultsBody');
  if (!mine.length) {
    rEl.innerHTML = '<tr><td colspan="7"><div class="empty"><div class="eico">' + icon('fileText', 34) + '</div>' +
      'No results yet — take your first quiz from your dashboard.</div></td></tr>';
  } else {
    rEl.innerHTML = mine.map(function (a) {
      return '<tr>' +
        '<td><b>' + esc(a.quizTitle) + '</b></td>' +
        '<td><b>' + a.score + '/' + a.maxScore + '</b></td>' +
        '<td><b>' + fmtPct(a.percent) + '</b></td>' +
        '<td><span class="badge ' + (a.passed ? 'ok' : 'bad') + '">' + (a.passed ? 'Pass' : 'Fail') + '</span></td>' +
        '<td>' + fmtDur(a.durationUsedSec) + '</td>' +
        '<td class="small muted">' + fmtWhen(a.submittedAt) + '</td>' +
        '<td><a class="btn sm" href="result.html?attempt=' + a.id + '">View</a></td>' +
        '</tr>';
    }).join('');
  }
})().catch(function () {});
</script>
</body>
</html>
