<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — ClassMark</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preload" href="fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231a73e8'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  .authwrap { min-height: calc(100vh - 62px); display: flex; align-items: center; justify-content: center; padding: 30px 16px; }
  .authcard { width: 100%; max-width: 430px; }
  .authcard .brand { justify-content: center; margin-bottom: 18px; font-size: 22px; }
</style>
</head>
<body>

<header class="topnav">
  <div class="container navrow">
    <a class="brand" href="index.html">
      <svg width="30" height="30" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#1a73e8"/><path d="M30 55l14 14 26-30" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>ClassMark</span>
    </a>
    <div class="navuser"><a class="btn ghost sm" href="index.html" id="backHome">Back home</a></div>
  </div>
</header>

<div class="authwrap">
  <div class="authcard">
    <div class="card" style="padding:28px">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#1a73e8"/><path d="M30 55l14 14 26-30" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div id="errBox" class="form-err" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="liEmail">Email address</label>
          <input id="liEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="liPw">Password</label>
          <input id="liPw" type="password" autocomplete="current-password" placeholder="Your password" required>
        </div>
        <button class="btn primary block" id="liBtn" type="submit">Sign in</button>
      </form>

    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
(function () {
  'use strict';

  pwField('liPw');
  document.getElementById('backHome').innerHTML = icon('arrowLeft', 15) + ' Back home';

  var errBox = document.getElementById('errBox');

  function showErr(msg) {
    errBox.innerHTML = icon('alertCircle', 16) + '<span>' + esc(msg) + '</span>';
    errBox.hidden = false;
  }
  function clearErr() { errBox.hidden = true; }

  function afterAuth(user) {
    var next = new URLSearchParams(location.search).get('next') || '';
    var safe = /^[\w-]+\.html(\?.*)?$/.test(next) ? next : null;
    location.href = safe || (user.role === 'admin' ? 'admin.html' : user.role === 'teacher' ? 'teacher.html' : 'dashboard.html');
  }

  document.getElementById('loginForm').onsubmit = async function (e) {
    e.preventDefault();
    clearErr();
    var btn = document.getElementById('liBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      var r = await POST('/api/auth/login', {
        email: document.getElementById('liEmail').value,
        password: document.getElementById('liPw').value
      });
      setToken(r.token);
      afterAuth(r.user);
    } catch (err) {
      showErr(err.message);
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  };
})();
</script>
</body>
</html>
