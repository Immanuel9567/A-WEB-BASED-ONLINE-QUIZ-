<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — OQAS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231a73e8'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  .authwrap { min-height: calc(100vh - 62px); display: flex; align-items: center; justify-content: center; padding: 30px 16px; }
  .authcard { width: 100%; max-width: 430px; }
  .authcard .brand { justify-content: center; margin-bottom: 18px; font-size: 22px; }
  .demoquick { display: flex; gap: 8px; margin-top: 16px; }
  .demoquick .btn { flex: 1; }
</style>
</head>
<body>

<header class="topnav">
  <div class="container navrow">
    <a class="brand" href="index.html">
      <svg width="30" height="30" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#1a73e8"/><path d="M30 55l14 14 26-30" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>OQAS</span>
    </a>
    <div class="navuser"><a class="btn ghost sm" href="index.html" id="backHome">Back home</a></div>
  </div>
</header>

<div class="authwrap">
  <div class="authcard">
    <div class="card" style="padding:28px">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#1a73e8"/><path d="M30 55l14 14 26-30" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="segment" style="margin-bottom:20px">
        <button type="button" id="tabLogin" class="on">Sign in</button>
        <button type="button" id="tabReg">Create account</button>
      </div>

      <div id="errBox" class="form-err" hidden></div>

      <!-- ============ SIGN IN ============ -->
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="liEmail">Email address</label>
          <input id="liEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="liPw">Password</label>
          <input id="liPw" type="password" autocomplete="current-password" placeholder="Your password" required>
        </div>
        <button class="btn primary block" id="liBtn" type="submit">Sign in</button>
        <div class="demoquick">
          <button class="btn sm" type="button" id="fillStudent"></button>
          <button class="btn sm" type="button" id="fillTeacher"></button>
        </div>
      </form>

      <!-- ============ REGISTER ============ -->
      <form id="regForm" hidden novalidate>
        <div class="field">
          <label for="rgName">Full name</label>
          <input id="rgName" type="text" autocomplete="name" placeholder="e.g. Ngozi Eze">
        </div>
        <div class="field">
          <label for="rgEmail">Email address</label>
          <input id="rgEmail" type="email" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="rgPw">Password</label>
          <input id="rgPw" type="password" autocomplete="new-password" placeholder="At least 6 characters">
          <div class="hint">Passwords are stored as salted SHA-256 hashes.</div>
        </div>
        <div class="field">
          <label>I am a</label>
          <div class="segment">
            <button type="button" id="roleStudent" class="on"></button>
            <button type="button" id="roleTeacher"></button>
          </div>
          <div class="hint">Role selection is open in this prototype for demonstration purposes.</div>
        </div>
        <div class="field" id="classField" hidden>
          <label for="rgClass">Class name</label>
          <input id="rgClass" type="text" placeholder="e.g. JSS 2 Blue">
          <div class="hint">Your class gets a unique join code — students use it to join your class.</div>
        </div>
        <button class="btn primary block" id="rgBtn" type="submit">Create account</button>
      </form>
    </div>
    <p class="center small muted" style="margin-top:14px">
      By continuing you agree to use this prototype for assessment purposes only.
    </p>
  </div>
</div>

<script src="js/app.js"></script>
<script>
(function () {
  'use strict';
  // icon-labelled buttons (uniform pack from app.js)
  document.getElementById('fillStudent').innerHTML = icon('bookOpen', 15) + ' Demo student';
  document.getElementById('fillTeacher').innerHTML = icon('presentation', 15) + ' Demo teacher';
  document.getElementById('roleStudent').innerHTML = icon('bookOpen', 15) + ' Student';
  document.getElementById('roleTeacher').innerHTML = icon('presentation', 15) + ' Teacher';
  document.getElementById('backHome').innerHTML = icon('arrowLeft', 15) + ' Back home';

  var role = 'student';
  var errBox = document.getElementById('errBox');

  function showErr(msg) {
    errBox.innerHTML = icon('alertCircle', 16) + '<span>' + esc(msg) + '</span>';
    errBox.hidden = false;
  }
  function clearErr() { errBox.hidden = true; }

  function switchTo(which) {
    clearErr();
    document.getElementById('tabLogin').classList.toggle('on', which === 'login');
    document.getElementById('tabReg').classList.toggle('on', which === 'reg');
    document.getElementById('loginForm').hidden = which !== 'login';
    document.getElementById('regForm').hidden = which !== 'reg';
  }
  document.getElementById('tabLogin').onclick = function () { switchTo('login'); };
  document.getElementById('tabReg').onclick = function () { switchTo('reg'); };

  document.getElementById('roleStudent').onclick = function () {
    role = 'student';
    this.classList.add('on');
    document.getElementById('roleTeacher').classList.remove('on');
    document.getElementById('classField').hidden = true;
  };
  document.getElementById('roleTeacher').onclick = function () {
    role = 'teacher';
    this.classList.add('on');
    document.getElementById('roleStudent').classList.remove('on');
    document.getElementById('classField').hidden = false;
  };

  document.getElementById('fillStudent').onclick = function () {
    document.getElementById('liEmail').value = 'student@demo.com';
    document.getElementById('liPw').value = 'study123';
  };
  document.getElementById('fillTeacher').onclick = function () {
    document.getElementById('liEmail').value = 'teacher@demo.com';
    document.getElementById('liPw').value = 'teach123';
  };

  function afterAuth(user) {
    var next = new URLSearchParams(location.search).get('next') || '';
    var safe = /^[\w-]+\.html(\?.*)?$/.test(next) ? next : null;
    location.href = safe || (user.role === 'teacher' ? 'teacher.html' : 'dashboard.html');
  }

  document.getElementById('loginForm').onsubmit = async function (e) {
    e.preventDefault();
    clearErr();
    var btn = document.getElementById('liBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      var r = await POST('/api/auth/login', {
        email: document.getElementById('liEmail').value,
        password: document.getElementById('liPw').value
      });
      setToken(r.token);
      afterAuth(r.user);
    } catch (err) {
      showErr(err.message);
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  };

  document.getElementById('regForm').onsubmit = async function (e) {
    e.preventDefault();
    clearErr();
    var btn = document.getElementById('rgBtn');
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      if (role === 'teacher' && !document.getElementById('rgClass').value.trim()) {
        throw new Error('Please enter a class name (e.g. JSS 2 Blue).');
      }
      var r = await POST('/api/auth/register', {
        name: document.getElementById('rgName').value,
        email: document.getElementById('rgEmail').value,
        password: document.getElementById('rgPw').value,
        role: role,
        className: role === 'teacher' ? document.getElementById('rgClass').value : ''
      });
      setToken(r.token);
      afterAuth(r.user);
    } catch (err) {
      showErr(err.message);
      btn.disabled = false; btn.textContent = 'Create account';
    }
  };
})();
</script>
</body>
</html>
