<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — ClassMark</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preload" href="fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231a73e8'/%3E%3Cpath d='M30 55l14 14 26-30' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="app">
<div id="nav"></div>

<main class="container">
  <section class="pagehead">
    <div>
      <h1>Admin</h1>
      <p class="sub" id="sub">Loading…</p>
    </div>
  </section>

  <h2 class="sec">Create login</h2>
  <section class="card tight">
    <form id="createForm" class="row" style="gap:10px;flex-wrap:wrap;align-items:center;padding:14px">
      <div class="segment" style="flex:0 0 auto">
        <button type="button" id="roleTeacher" class="on"></button>
        <button type="button" id="roleStudent"></button>
      </div>
      <input id="newName" type="text" placeholder="Full name" autocomplete="off" style="flex:1;min-width:150px">
      <input id="newEmail" type="email" placeholder="Email address" autocomplete="off" style="flex:1;min-width:200px">
      <button class="btn primary" id="createBtn" type="submit"></button>
    </form>
  </section>

  <h2 class="sec">Teacher accounts</h2>
  <section class="card tablecard">
    <table>
      <thead><tr>
        <th>Name</th><th>Email</th><th>Joined</th><th></th>
      </tr></thead>
      <tbody id="tRows"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
    </table>
  </section>

  <h2 class="sec">Student accounts</h2>
  <section class="card tablecard">
    <table>
      <thead><tr>
        <th>Name</th><th>Email</th><th>Joined</th><th></th>
      </tr></thead>
      <tbody id="sRows"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
    </table>
  </section>
</main>

<script src="js/app.js"></script>
<script>
(async function () {
  var user = await requireLogin();
  if (!user.admin) {
    location.href = user.role === 'teacher' ? 'teacher.html' : 'dashboard.html';
    return;
  }
  navbar(user, 'admin');

  var role = 'teacher';
  document.getElementById('roleTeacher').innerHTML = icon('presentation', 15) + ' Teacher';
  document.getElementById('roleStudent').innerHTML = icon('bookOpen', 15) + ' Student';
  document.getElementById('roleTeacher').onclick = function () {
    role = 'teacher';
    this.classList.add('on');
    document.getElementById('roleStudent').classList.remove('on');
  };
  document.getElementById('roleStudent').onclick = function () {
    role = 'student';
    this.classList.add('on');
    document.getElementById('roleTeacher').classList.remove('on');
  };
  document.getElementById('createBtn').innerHTML = icon('plus', 15) + ' Create login';

  var sub = document.getElementById('sub');
  var tRows = document.getElementById('tRows');
  var sRows = document.getElementById('sRows');

  function rowsHtml(list) {
    if (!list.length) return '<tr><td colspan="4" class="muted">No accounts yet.</td></tr>';
    return list.map(function (t) {
      return '<tr><td><b>' + esc(t.name) + '</b></td><td>' + esc(t.email) + '</td>' +
        '<td class="small muted">' + fmtWhen(t.createdAt) + '</td>' +
        '<td><button class="btn sm" data-rp="' + esc(t.id) + '">' + icon('refresh', 13) + ' Reset password</button></td></tr>';
    }).join('');
  }

  function paint(d) {
    sub.textContent = d.teachers.length + ' teachers · ' + d.students.length + ' students';
    tRows.innerHTML = rowsHtml(d.teachers);
    sRows.innerHTML = rowsHtml(d.students);
  }

  async function load() {
    try { paint(await GET('/api/admin/accounts')); }
    catch (e) { tRows.innerHTML = '<tr><td colspan="4" class="muted">' + esc(e.message) + '</td></tr>'; }
  }

  function showCredentials(title, email, pw) {
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML =
      '<div class="modal"><h3>' + esc(title) + '</h3>' +
      '<p class="muted" style="margin-bottom:8px">' + esc(email) + '</p>' +
      '<p style="margin:0 0 6px"><span class="mono" data-copy style="font-size:16px;font-weight:600;cursor:pointer"></span></p>' +
      '<div class="modal-actions"><button class="btn" data-x>Close</button></div></div>';
    document.body.appendChild(ov);
    var codeEl = ov.querySelector('[data-copy]');
    codeEl.textContent = pw;
    codeEl.onclick = function () { copyText(pw, 'Password copied'); };
    ov.querySelector('[data-x]').onclick = function () { ov.remove(); };
    ov.onclick = function (e) { if (e.target === ov) ov.remove(); };
  }

  document.getElementById('createForm').onsubmit = async function (e) {
    e.preventDefault();
    var name = document.getElementById('newName').value.trim();
    var email = document.getElementById('newEmail').value.trim();
    if (!name || !email) return;
    try {
      var r = await POST('/api/admin/users', { name: name, email: email, role: role });
      document.getElementById('newName').value = '';
      document.getElementById('newEmail').value = '';
      showCredentials('Login created', r.user.email, r.password);
      load();
    } catch (err) {
      toast(err.message, 'bad');
    }
  };

  function resetHandler(e) {
    return (async function () {
      var btn = e.target.closest('[data-rp]');
      if (!btn) return;
      var row = btn.closest('tr');
      var email = row && row.children[1] ? row.children[1].textContent : '';
      var yes = await confirmModal({
        title: 'Reset password',
        body: 'A new password will be generated for ' + esc(email) + '.',
        okText: 'Reset'
      });
      if (!yes) return;
      try {
        var r = await POST('/api/admin/users/' + btn.getAttribute('data-rp') + '/password');
        showCredentials('Password reset', r.email, r.password);
      } catch (err) {
        toast(err.message, 'bad');
      }
    })();
  }
  tRows.addEventListener('click', resetHandler);
  sRows.addEventListener('click', resetHandler);

  load();
})();
</script>
</body>
</html>
